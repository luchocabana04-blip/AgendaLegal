<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Mariana Sánchez &amp; Asociados</title>
  <meta name="theme-color" content="#07090F">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
  
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>

  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --bg:#07090F;--s1:#0D1120;--s2:#141C33;--s3:#1A2240;--s4:#22304C;
      --bd:#2A3860;--bd2:#1A2440;
      --gold:#C9A84C;--gold2:#E8C870;--gold3:#9B7A30;
      --tx:#DDD8CC;--tx2:#8A9AB8;--tx3:#35486A;
      --green:#3DAA6A;--red:#C94C4C;--wsp:#25D366;
      --safe-t:env(safe-area-inset-top,0px);
      --safe-b:env(safe-area-inset-bottom,0px);
    }
    html,body,#root{height:100%; width:100%; overflow:hidden;}
    body{font-family:'Jost',sans-serif;background:var(--bg);color:var(--tx);
      padding-top:var(--safe-t);padding-bottom:var(--safe-b);-webkit-font-smoothing:antialiased}
    *{-webkit-tap-highlight-color:transparent}
    button{cursor:pointer;font-family:'Jost',sans-serif;border:none;outline:none}
    input,select,textarea{background:var(--s3);border:1px solid var(--bd2);color:var(--tx);
      font-family:'Jost',sans-serif;border-radius:6px;padding:8px 12px;width:100%;font-size:13px;outline:none}
    input:focus,select:focus,textarea:focus{border-color:var(--gold)}
    textarea{resize:vertical;min-height:60px}

    /* ANIMACIONES */
    @keyframes fadeIn{from{opacity:0}to{opacity:1}}
    @keyframes slideUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
    .fade-in{animation:fadeIn .25s ease}

    /* BOTONES PREMIUM */
    .btn-gold{padding:12px;background:linear-gradient(145deg,var(--gold3),var(--gold));
      border-radius:8px;color:#08060A;font-size:12px;font-weight:700;
      letter-spacing:.1em;text-transform:uppercase;transition:all .2s;
      display:inline-flex;align-items:center;justify-content:center;gap:6px;width:100%;box-shadow:0 4px 15px rgba(201,168,76,.2)}
    .btn-gold:hover:not(:disabled){transform:translateY(-1px);background:linear-gradient(145deg,var(--gold),var(--gold2))}
    .btn-p{padding:8px 16px;background:var(--gold);color:#000;font-weight:600;font-size:12px;border-radius:6px}
    .btn-s{padding:8px 16px;background:var(--s3);color:var(--tx2);border:1px solid var(--bd2);font-size:12px;border-radius:6px}
    .btn-d{padding:8px 12px;background:rgba(201,76,76,0.15);color:#FF8888;border:1px solid rgba(201,76,76,0.3);font-size:12px;border-radius:6px}
    .btn-wsp{padding:4px 8px;background:rgba(37,211,102,0.15);color:var(--wsp);border:1px solid rgba(37,211,102,0.3);font-size:11px;border-radius:4px;display:inline-flex;align-items:center;gap:4px;font-weight:600}

    /* LAYOUT PRINCIPAL (ESCRITORIO) */
    .layout{display:grid;grid-template-columns:240px 1fr;height:100vh;overflow:hidden}
    
    /* SIDEBAR */
    .sidebar{background:var(--s1);border-right:1px solid var(--bd2);display:flex;flex-direction:column;overflow:hidden;z-index:10}
    .sb-hd{padding:16px 12px;border-bottom:1px solid var(--bd2);display:flex;align-items:center;gap:10px}
    .l-sello{width:32px;height:32px;border:1.5px solid var(--gold);border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Playfair Display',serif;font-size:8px;color:var(--gold)}
    .l-nm{font-family:'Playfair Display',serif;font-size:12px;font-weight:700;color:var(--tx);line-height:1.2}
    .l-sb{font-size:8.5px;color:var(--gold);letter-spacing:.15em;text-transform:uppercase}
    
    .sb-body{flex:1;overflow-y:auto;padding:10px}
    .sb-sec{font-size:9px;color:var(--tx3);text-transform:uppercase;letter-spacing:.1em;padding:8px 6px 4px;display:flex;justify-content:space-between;align-items:center}
    .abg-row{display:flex;align-items:center;gap:8px;padding:6px;border-radius:6px;cursor:pointer;margin-bottom:2px}
    .abg-row:hover, .abg-row.on{background:var(--s2)}
    .av{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;color:#000;flex-shrink:0}
    .a-nm{font-size:11.5px;color:var(--tx);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    
    /* MAIN AREA */
    .main{display:flex;flex-direction:column;overflow:hidden;background:var(--bg)}
    .main-hd{background:var(--s1);border-bottom:1px solid var(--bd2);padding:10px 14px;display:flex;align-items:center;justify-content:space-between;gap:8px}
    .nav-btn{width:28px;height:28px;background:var(--s2);color:var(--tx2);border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:16px}
    .mes-tit{font-family:'Playfair Display',serif;font-size:16px;color:var(--tx)}
    
    .vtabs{display:flex;background:var(--s2);padding:3px;border-radius:6px}
    .vtab{padding:5px 10px;background:transparent;color:var(--tx2);font-size:11px;border-radius:4px;font-weight:500}
    .vtab.on{background:var(--s4);color:var(--gold)}
    
    .cal-scroll{flex:1;overflow-y:auto;padding:10px;position:relative}

    /* CALENDARIO MES */
    .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--bd2);border:1px solid var(--bd2);border-radius:8px;overflow:hidden}
    .cal-hdr{background:var(--s1);text-align:center;padding:6px;font-size:9.5px;color:var(--tx2);text-transform:uppercase}
    .cal-cell{background:var(--s1);min-height:85px;padding:4px;display:flex;flex-direction:column;cursor:pointer}
    .cal-cell.otra{background:var(--bg);opacity:0.5}
    .cal-cell.hoy{background:var(--s2);border-top:2px solid var(--gold)}
    .dn{font-size:11px;font-weight:600;color:var(--tx2);width:20px;height:20px;display:flex;align-items:center;justify-content:center;margin-bottom:2px}
    .cal-cell.hoy .dn{background:var(--gold);color:#000;border-radius:50%}
    .chip{padding:2px 4px;border-radius:3px;font-size:9px;color:#fff;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

    /* LISTAS / TARJETAS */
    .list-card{background:var(--s1);border:1px solid var(--bd2);border-radius:8px;padding:10px;display:flex;gap:10px;margin-bottom:8px;align-items:center}
    .list-bar{width:4px;border-radius:2px;align-self:stretch}
    .list-tit{font-size:13px;font-weight:600;color:var(--tx);margin-bottom:2px}
    .list-meta{font-size:11px;color:var(--tx2)}

    /* MODALES OPTIMIZADOS */
    .modal-ov{position:fixed;inset:0;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;z-index:200;padding:10px;backdrop-filter:blur(3px)}
    .modal-box{background:var(--s1);border:1px solid var(--bd);border-radius:12px;width:100%;max-width:500px;max-height:95vh;display:flex;flex-direction:column;animation:slideUp .2s ease}
    .modal-hd{padding:14px 16px;border-bottom:1px solid var(--bd2);display:flex;justify-content:space-between;align-items:center;flex-shrink:0}
    .modal-tit{font-family:'Playfair Display',serif;font-size:16px;color:var(--tx)}
    .modal-bd{padding:16px;overflow-y:auto;display:flex;flex-direction:column;gap:12px}
    .modal-ft{padding:12px 16px;border-top:1px solid var(--bd2);display:flex;gap:8px;justify-content:flex-end;flex-shrink:0}
    
    .f-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .m-lbl{font-size:10px;color:var(--tx2);text-transform:uppercase;letter-spacing:.05em;display:block;margin-bottom:4px}
    .chk-row{display:flex;align-items:center;gap:8px;padding:6px 8px;border:1px solid var(--bd2);border-radius:6px;cursor:pointer}
    .chk-row.on{background:var(--s2);border-color:var(--gold3)}

    /* MOBILE NAVIGATION BAR */
    .bottom-nav{display:none;background:var(--s1);border-top:1px solid var(--bd2);padding:8px 10px;padding-bottom:calc(8px + var(--safe-b));justify-content:space-around;align-items:center;z-index:50}
    .bn-item{display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--tx2);font-size:9px;text-transform:uppercase}
    .bn-item.on{color:var(--gold)}
    .bn-icon{font-size:18px}
    .bn-fab{background:var(--gold);color:#000;width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;margin-top:-20px;box-shadow:0 4px 10px rgba(201,168,76,.4)}

    /* AJUSTES RESPONSIVE (CELULAR) */
    @media(max-width: 768px){
      .layout{grid-template-columns:1fr;grid-template-rows:1fr auto}
      .sidebar{display:none} /* Se oculta en celu, manejado por Bottom Nav */
      .bottom-nav{display:flex}
      .main-hd{flex-wrap:wrap; gap:8px;}
      .main-hd .vtabs{order:3; width:100%; justify-content:space-between}
      .main-hd .vtabs .vtab{flex:1; text-align:center}
      .cal-cell{min-height:70px}
      .chip{font-size:8.5px; padding:2px}
      .f-row{grid-template-columns:1fr} /* Formularios de 1 columna en celu */
    }

  </style>
</head>
<body>

<div id="root"></div>

<script type="text/babel">
const { useState, useEffect } = React;
const { createClient } = window.supabase;

const TIPOS = [
  { id:"audiencia",   label:"Audiencia",   icon:"⚖️" },
  { id:"vencimiento", label:"Vencimiento", icon:"⏰" },
  { id:"reunion",     label:"Reunión",     icon:"🤝" },
  { id:"otro",        label:"Otro",        icon:"📋" }
];

const DIAS = ["Dom","Lun","Mar","Mié","Jue","Vie","Sáb"];
const MESES = ["Ene","Feb","Mar","Abr","May","Jun","Jul","Ago","Sep","Oct","Nov","Dic"];
const hoyStr = () => new Date().toISOString().split("T")[0];

// Abogados por defecto si es la primera vez
const defAbogados = [
  { id:"p",  nombre:"Dra. Mariana Sánchez", ini:"MS", color:"#C9A84C" },
  { id:"a1", nombre:"Dr. Carlos Mendoza",   ini:"CM", color:"#5491C8" },
];

function App() {
  const [pantalla, setPantalla] = useState("login"); 
  const [sb, setSb] = useState(null);
  
  // ESTADOS DE DATOS
  const [eventos, setEventos] = useState([]);
  const [abogados, setAbogados] = useState(() => JSON.parse(localStorage.getItem("agenda_abg")) || defAbogados);
  const [alertas, setAlertas] = useState(() => JSON.parse(localStorage.getItem("agenda_alerts")) || { email:"", wsp:"" });
  
  // ESTADOS UI
  const [vista, setVista] = useState("mes");
  const [curFecha, setCurFecha] = useState(new Date());
  const [filtroAbg, setFiltroAbg] = useState(null);
  const [modalEv, setModalEv] = useState(null); // null = cerrado, {} = nuevo, {...} = editar
  const [modalEquipo, setModalEquipo] = useState(false);
  const [modalAlertas, setModalAlertas] = useState(false);

  // EFECTOS DE GUARDADO LOCAL
  useEffect(() => localStorage.setItem("agenda_abg", JSON.stringify(abogados)), [abogados]);
  useEffect(() => localStorage.setItem("agenda_alerts", JSON.stringify(alertas)), [alertas]);

  // INICIO SUPABASE
  useEffect(() => {
    const url = localStorage.getItem("sb_url");
    const key = localStorage.getItem("sb_key");
    if (url && key) {
      try {
        const client = createClient(url, key);
        setSb(client);
        fetchEventos(client);
      } catch(e) { setPantalla("config"); }
    } else {
      setPantalla("config");
    }
  }, []);

  const fetchEventos = async (client) => {
    try {
      const { data, error } = await client.from("eventos").select("*");
      if (!error && data) {
        setEventos(data.map(d => ({
          id: d.id, title: d.title || "Causa", type: d.type || "audiencia",
          date: d.date || hoyStr(), startTime: d.start_time || "09:00",
          endTime: d.end_time || "10:00", lawyers: d.lawyers || [],
          notes: d.notes || "", court: d.court || "", expNum: d.exp_num || ""
        })));
      }
    } catch(e) { console.error(e); }
  };

  const guardarEv = async (f) => {
    const payload = {
      id: f.id || `e_${Date.now()}`, title: f.title, type: f.type, date: f.date,
      start_time: f.startTime, end_time: f.endTime, lawyers: f.lawyers,
      notes: f.notes, court: f.court, exp_num: f.expNum
    };
    try { await sb.from("eventos").upsert(payload); setModalEv(null); fetchEventos(sb); } catch(e) {}
  };

  const eliminarEv = async (id) => {
    try { await sb.from("eventos").delete().eq("id", id); setModalEv(null); fetchEventos(sb); } catch(e) {}
  };

  // ENVIAR WHATSAPP
  const generarWsp = (ev) => {
    if(!alertas.wsp) return alert("Configurá tu número de WhatsApp primero en la sección de Alertas (🔔)");
    const num = alertas.wsp.replace(/[^0-9]/g, '');
    const texto = `*RECORDATORIO JUDICIAL* ⚖️\n\n*Causa:* ${ev.title}\n*Fecha:* ${ev.date}\n*Hora:* ${ev.startTime}\n*Expediente:* ${ev.expNum||'-'}\n*Juzgado:* ${ev.court||'-'}\n\n_Enviado desde Agenda Mariana Sánchez_`;
    window.open(`https://wa.me/${num}?text=${encodeURIComponent(texto)}`, '_blank');
  };

  // VISTAS
  const renderCalendario = () => {
    const filtrados = filtroAbg ? eventos.filter(e=>e.lawyers?.includes(filtroAbg)) : eventos;
    
    if(vista === "mes") {
      const año = curFecha.getFullYear(); const mes = curFecha.getMonth();
      const pri = new Date(año,mes,1).getDay(); const dias = new Date(año,mes+1,0).getDate();
      const prev = new Date(año,mes,0).getDate();
      const cels = [];
      for(let i=pri-1;i>=0;i--) cels.push({d:prev-i,otra:true,m:mes-1});
      for(let i=1;i<=dias;i++) cels.push({d:i,otra:false,m:mes});
      while(cels.length % 7 !== 0) cels.push({d:cels.length-dias-pri+1,otra:true,m:mes+1});

      return (
        <div className="cal-grid fade-in">
          {DIAS.map(d=><div key={d} className="cal-hdr">{d}</div>)}
          {cels.map((c,idx)=>{
            const ds = `${año}-${String(c.m+1).padStart(2,"0")}-${String(c.d).padStart(2,"0")}`;
            const des = filtrados.filter(e=>e.date===ds);
            return (
              <div key={idx} className={`cal-cell ${c.otra?"otra":""} ${ds===hoyStr()?"hoy":""}`} onClick={()=>!c.otra && setCurFecha(new Date(ds+"T12:00:00")) || setVista("dia")}>
                <div className="dn">{c.d}</div>
                <div style={{flex:1,overflow:"hidden"}}>
                  {des.slice(0,3).map(e=>(
                    <div key={e.id} className="chip" style={{background:abogados.find(a=>a.id===(e.lawyers?.[0]))?.color || "var(--gold)"}} onClick={(x)=>{x.stopPropagation(); setModalEv(e);}}>
                      {e.title}
                    </div>
                  ))}
                  {des.length>3 && <div style={{fontSize:9,color:"var(--gold)"}}>+{des.length-3}</div>}
                </div>
              </div>
            );
          })}
        </div>
      );
    }

    if(vista === "dia") {
      const ds = curFecha.toISOString().split("T")[0];
      const dEvs = filtrados.filter(e=>e.date===ds).sort((a,b)=>a.startTime.localeCompare(b.startTime));
      return (
        <div className="fade-in">
          <div style={{fontSize:14, fontWeight:600, marginBottom:12, paddingBottom:8, borderBottom:"1px solid var(--bd2)"}}>
            {curFecha.toLocaleDateString("es-AR",{weekday:"long",day:"numeric",month:"long"})}
          </div>
          {dEvs.length===0 ? <div style={{textAlign:"center", color:"var(--tx3)", padding:20}}>Sin causas agendadas.</div> : 
            dEvs.map(ev=>(
              <div key={ev.id} className="list-card" onClick={()=>setModalEv(ev)}>
                <div className="list-bar" style={{background:abogados.find(a=>a.id===(ev.lawyers?.[0]))?.color || "var(--gold)"}}/>
                <div style={{flex:1}}>
                  <div className="list-tit">{ev.startTime} hs - {ev.title}</div>
                  <div className="list-meta">Exp: {ev.expNum||"S/D"} | {ev.court||"S/D"}</div>
                </div>
                <button className="btn-wsp" onClick={(e)=>{e.stopPropagation(); generarWsp(ev);}}>WSP</button>
              </div>
            ))
          }
        </div>
      );
    }

    if(vista === "lista") {
      return (
        <div className="fade-in">
          {filtrados.sort((a,b)=>a.date.localeCompare(b.date)).map(ev=>(
            <div key={ev.id} className="list-card" onClick={()=>setModalEv(ev)}>
              <div className="list-bar" style={{background:abogados.find(a=>a.id===(ev.lawyers?.[0]))?.color || "var(--gold)"}}/>
              <div style={{flex:1}}>
                <div className="list-tit">[{ev.date}] {ev.title}</div>
                <div className="list-meta">Exp: {ev.expNum||"S/D"}</div>
              </div>
            </div>
          ))}
        </div>
      );
    }
  };

  // PANTALLAS DE ACCESO
  if (pantalla === "config") {
    return (
      <div className="pant-bg fade-in" style={{padding:20}}>
        <div style={{background:"var(--s1)", padding:24, borderRadius:12, width:"100%", maxWidth:400, border:"1px solid var(--bd2)"}}>
          <h2 style={{color:"var(--gold)", marginBottom:10, textAlign:"center"}}>Conectar Supabase</h2>
          <input id="inUrl" placeholder="URL Supabase" defaultValue={localStorage.getItem("sb_url")} style={{marginBottom:10}}/>
          <input id="inKey" type="password" placeholder="Anon Key" defaultValue={localStorage.getItem("sb_key")} style={{marginBottom:20}}/>
          <button className="btn-gold" onClick={()=>{
            localStorage.setItem("sb_url", document.getElementById("inUrl").value);
            localStorage.setItem("sb_key", document.getElementById("inKey").value);
            window.location.reload();
          }}>Guardar y Entrar</button>
        </div>
      </div>
    );
  }

  if (pantalla === "login") {
    return (
      <div className="pant-bg fade-in" style={{padding:20}}>
        <div style={{background:"var(--s1)", padding:30, borderRadius:16, width:"100%", maxWidth:400, border:"1px solid var(--bd2)", textAlign:"center"}}>
          <div style={{width:60,height:60,border:"2px solid var(--gold)",borderRadius:"50%",display:"flex",alignItems:"center",justifyContent:"center",margin:"0 auto 16px",color:"var(--gold)",fontFamily:"serif"}}>M.S.</div>
          <h1 style={{fontSize:20, marginBottom:20}}>Mariana Sánchez & Asociados</h1>
          <button className="btn-gold" onClick={()=>setPantalla("app")}>Ingresar al Sistema</button>
          <button style={{background:"none", color:"var(--tx2)", fontSize:11, marginTop:16, textDecoration:"underline"}} onClick={()=>setPantalla("config")}>Configurar Servidor</button>
        </div>
      </div>
    );
  }

  return (
    <div className="layout fade-in">
      
      {/* SIDEBAR PC */}
      <div className="sidebar">
        <div className="sb-hd">
          <div className="l-sello">M.S.</div>
          <div><div className="l-nm">Mariana Sánchez</div><div className="l-sb">Agenda Legal</div></div>
        </div>
        <div className="sb-body">
          <div className="sb-sec"><span>Miembros del Estudio</span> <button style={{background:"none", color:"var(--gold)", fontSize:16}} onClick={()=>setModalEquipo(true)}>⚙️</button></div>
          <div className={`abg-row ${filtroAbg===null?"on":""}`} onClick={()=>setFiltroAbg(null)}>
            <div className="av" style={{background:"var(--s4)",color:"var(--tx)"}}>∀</div><div className="a-nm">Todos</div>
          </div>
          {abogados.map(a=>(
            <div key={a.id} className={`abg-row ${filtroAbg===a.id?"on":""}`} onClick={()=>setFiltroAbg(a.id)}>
              <div className="av" style={{background:a.color}}>{a.ini}</div><div className="a-nm">{a.nombre}</div>
            </div>
          ))}
        </div>
        <div style={{padding:12, borderTop:"1px solid var(--bd2)"}}>
          <button className="btn-s" style={{width:"100%", marginBottom:8}} onClick={()=>setModalAlertas(true)}>🔔 Alertas / WSP</button>
          <button className="btn-s" style={{width:"100%", color:"var(--red)"}} onClick={()=>setPantalla("login")}>Cerrar Sesión</button>
        </div>
      </div>

      {/* MAIN APP */}
      <div className="main">
        <div className="main-hd">
          <div style={{display:"flex",alignItems:"center",gap:4}}>
            <button className="nav-btn" onClick={()=>setCurFecha(new Date(curFecha.getFullYear(), curFecha.getMonth()-1, 1))}>‹</button>
            <span className="mes-tit" style={{margin:"0 4px"}}>{MESES[curFecha.getMonth()]} {curFecha.getFullYear()}</span>
            <button className="nav-btn" onClick={()=>setCurFecha(new Date(curFecha.getFullYear(), curFecha.getMonth()+1, 1))}>›</button>
          </div>
          <div className="vtabs">
            {["mes","dia","lista"].map(v=><button key={v} className={`vtab ${vista===v?"on":""}`} onClick={()=>setVista(v)}>{v.toUpperCase()}</button>)}
          </div>
          <button className="nav-btn" style={{background:"transparent", color:"var(--gold)", width:auto}} onClick={()=>setCurFecha(new Date())}>HOY</button>
        </div>
        <div className="cal-scroll">
          {renderCalendario()}
        </div>
      </div>

      {/* BOTTOM NAV (MOBILE) */}
      <div className="bottom-nav">
        <div className={`bn-item ${vista==="mes"?"on":""}`} onClick={()=>setVista("mes")}><span className="bn-icon">📅</span>Mes</div>
        <div className={`bn-item ${vista==="lista"?"on":""}`} onClick={()=>setVista("lista")}><span className="bn-icon">📋</span>Lista</div>
        <div className="bn-item" onClick={()=>{setModalEv({date:hoyStr()})}}><div className="bn-fab">+</div></div>
        <div className="bn-item" onClick={()=>setModalEquipo(true)}><span className="bn-icon">👥</span>Equipo</div>
        <div className="bn-item" onClick={()=>setModalAlertas(true)}><span className="bn-icon">🔔</span>Alertas</div>
      </div>

      {/* MODAL EVENTO */}
      {modalEv && (
        <div className="modal-ov" onClick={e=>e.target===e.currentTarget&&setModalEv(null)}>
          <div className="modal-box">
            <div className="modal-hd">
              <div className="modal-tit">{modalEv.id ? "Editar Causa" : "Nueva Causa"}</div>
              <button style={{background:"none", color:"var(--tx2)", fontSize:18}} onClick={()=>setModalEv(null)}>✕</button>
            </div>
            <div className="modal-bd">
              <div className="f-grp"><label className="m-lbl">Carátula *</label><input defaultValue={modalEv.title} id="ev_t"/></div>
              <div className="f-row">
                <div className="f-grp"><label className="m-lbl">N° Exp</label><input defaultValue={modalEv.expNum} id="ev_exp"/></div>
                <div className="f-grp"><label className="m-lbl">Juzgado</label><input defaultValue={modalEv.court} id="ev_c"/></div>
              </div>
              <div className="f-row">
                <div className="f-grp"><label className="m-lbl">Fecha</label><input type="date" defaultValue={modalEv.date} id="ev_d"/></div>
                <div className="f-grp"><label className="m-lbl">Hora</label><input type="time" defaultValue={modalEv.startTime||"09:00"} id="ev_h"/></div>
              </div>
              <div className="f-grp">
                <label className="m-lbl">Asignar Profesional</label>
                <select id="ev_abg" defaultValue={modalEv.lawyers?.[0]||"p"}>
                  {abogados.map(a=><option key={a.id} value={a.id}>{a.nombre}</option>)}
                </select>
              </div>
              <div className="f-grp"><label className="m-lbl">Notas internas</label><textarea defaultValue={modalEv.notes} id="ev_n"/></div>
            </div>
            <div className="modal-ft">
              {modalEv.id && <button className="btn-d" onClick={()=>eliminarEv(modalEv.id)}>Eliminar</button>}
              <button className="btn-s" onClick={()=>setModalEv(null)}>Cancelar</button>
              <button className="btn-p" onClick={()=>guardarEv({
                ...modalEv, title:document.getElementById("ev_t").value, expNum:document.getElementById("ev_exp").value,
                court:document.getElementById("ev_c").value, date:document.getElementById("ev_d").value,
                startTime:document.getElementById("ev_h").value, lawyers:[document.getElementById("ev_abg").value],
                notes:document.getElementById("ev_n").value
              })}>Guardar</button>
            </div>
          </div>
        </div>
      )}

      {/* MODAL EQUIPO (ABOGADOS) */}
      {modalEquipo && (
        <div className="modal-ov" onClick={e=>e.target===e.currentTarget&&setModalEquipo(false)}>
          <div className="modal-box">
            <div className="modal-hd"><div className="modal-tit">Gestión de Abogados</div><button style={{background:"none",color:"var(--tx2)"}} onClick={()=>setModalEquipo(false)}>✕</button></div>
            <div className="modal-bd">
              {abogados.map((a, i)=>(
                <div key={a.id} style={{display:"flex", gap:8, alignItems:"center", background:"var(--s2)", padding:8, borderRadius:6}}>
                  <div className="av" style={{background:a.color}}>{a.ini}</div>
                  <div style={{flex:1, fontSize:13}}>{a.nombre}</div>
                  <button className="btn-d" style={{padding:"4px 8px", marginRight:0}} onClick={()=>{
                    if(confirm("¿Eliminar a "+a.nombre+"?")) setAbogados(abogados.filter(x=>x.id!==a.id));
                  }}>Borrar</button>
                </div>
              ))}
              <div style={{borderTop:"1px solid var(--bd2)", paddingTop:12, marginTop:4}}>
                <div style={{fontSize:12, color:"var(--gold)", marginBottom:8}}>+ Agregar Nuevo Miembro</div>
                <div className="f-grp"><input id="n_nom" placeholder="Nombre completo (ej: Dr. Juan Pérez)"/></div>
                <div className="f-row">
                  <div className="f-grp"><input id="n_ini" placeholder="Iniciales (ej: JP)" maxLength={3}/></div>
                  <div className="f-grp">
                    <select id="n_col">
                      <option value="#5491C8">Azul</option><option value="#4DAAA0">Verde</option>
                      <option value="#8E6DC4">Violeta</option><option value="#C46D6D">Rojo</option>
                      <option value="#C9A84C">Dorado</option>
                    </select>
                  </div>
                </div>
                <button className="btn-s" style={{width:"100%"}} onClick={()=>{
                  const nom = document.getElementById("n_nom").value; const ini = document.getElementById("n_ini").value;
                  if(!nom || !ini) return alert("Completá nombre e iniciales.");
                  setAbogados([...abogados, {id:"a_"+Date.now(), nombre:nom, ini:ini.toUpperCase(), color:document.getElementById("n_col").value}]);
                  document.getElementById("n_nom").value = ""; document.getElementById("n_ini").value = "";
                }}>Agregar Abogado</button>
              </div>
            </div>
          </div>
        </div>
      )}

      {/* MODAL ALERTAS WSP */}
      {modalAlertas && (
        <div className="modal-ov" onClick={e=>e.target===e.currentTarget&&setModalAlertas(false)}>
          <div className="modal-box">
            <div className="modal-hd"><div className="modal-tit">Configuración de Alertas</div><button style={{background:"none",color:"var(--tx2)"}} onClick={()=>setModalAlertas(false)}>✕</button></div>
            <div className="modal-bd">
              <p style={{fontSize:12, color:"var(--tx2)", lineHeight:1.5}}>Configurá el número al que querés enviar los mensajes de recordatorio por WhatsApp. Usá el formato completo.</p>
              <div className="f-grp">
                <label className="m-lbl">Número WhatsApp (ej: 5492604123456) *</label>
                <input value={alertas.wsp} onChange={e=>setAlertas({...alertas, wsp:e.target.value})} placeholder="549..."/>
              </div>
              <div className="f-grp">
                <label className="m-lbl">E-mail corporativo</label>
                <input value={alertas.email} onChange={e=>setAlertas({...alertas, email:e.target.value})} placeholder="estudio@..."/>
              </div>
              <button className="btn-wsp" style={{justifyContent:"center", padding:"10px", fontSize:12, width:"100%"}} onClick={()=>{
                if(!alertas.wsp) return alert("Ingresá un número primero");
                window.open(`https://wa.me/${alertas.wsp.replace(/[^0-9]/g,'')}?text=Prueba%20de%20conexion%20Agenda%20Legal`, '_blank');
              }}>Probar Conexión WhatsApp</button>
            </div>
            <div className="modal-ft"><button className="btn-p" onClick={()=>setModalAlertas(false)}>Listo</button></div>
          </div>
        </div>
      )}

    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root")); 
root.render(<App />);
</script>
</body>
</html>
