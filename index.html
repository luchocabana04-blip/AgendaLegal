<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>González &amp; Asociados — Sistema de Agenda</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,500&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    *,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
    :root {
      --bg:    #07090F;
      --s1:    #0D1120;
      --s2:    #141C33;
      --s3:    #1A2240;
      --s4:    #22304C;
      --bd:    #2A3860;
      --bd2:   #1A2440;
      --gold:  #C9A84C;
      --gold2: #E8C870;
      --gold3: #9B7A30;
      --tx:    #DDD8CC;
      --tx2:   #8A9AB8;
      --tx3:   #35486A;
    }
    html,body,#root { height:100%; }
    body { font-family:'Jost',sans-serif; background:var(--bg); color:var(--tx); overflow:hidden; }

    ::-webkit-scrollbar       { width:5px; height:5px; }
    ::-webkit-scrollbar-track { background:transparent; }
    ::-webkit-scrollbar-thumb { background:var(--bd2); border-radius:3px; }
    ::-webkit-scrollbar-thumb:hover { background:var(--bd); }

    input,select,textarea {
      background:var(--s3); border:1px solid var(--bd2); color:var(--tx);
      font-family:'Jost',sans-serif; border-radius:7px;
      padding:8px 12px; width:100%; font-size:13.5px;
      transition:border-color .2s; outline:none;
    }
    input:focus,select:focus,textarea:focus { border-color:var(--gold); box-shadow:0 0 0 3px rgba(201,168,76,.08); }
    input::placeholder,textarea::placeholder { color:var(--tx3); }
    select option { background:var(--s2); }
    textarea { resize:vertical; min-height:76px; }
    button { cursor:pointer; font-family:'Jost',sans-serif; }
    input[type="date"]::-webkit-calendar-picker-indicator { filter:invert(.5); }

    @keyframes fadeIn    { from{opacity:0;transform:translateY(10px)}  to{opacity:1;transform:translateY(0)} }
    @keyframes slideUp   { from{opacity:0;transform:translateY(20px)}  to{opacity:1;transform:translateY(0)} }
    @keyframes pulsar    { 0%,100%{opacity:1;transform:scale(1)}       50%{opacity:.55;transform:scale(.9)} }
    @keyframes loginFade { from{opacity:0;transform:scale(.97) translateY(12px)} to{opacity:1;transform:scale(1) translateY(0)} }

    .fade-in { animation:fadeIn  .3s ease; }
    .pulsar  { animation:pulsar 1.8s infinite; }

    /* ── LOGIN ── */
    .login-bg {
      height:100vh; display:flex; align-items:center; justify-content:center;
      background:var(--bg); position:relative; overflow:hidden;
    }
    .login-bg::before {
      content:''; position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
      width:800px; height:800px;
      background:radial-gradient(ellipse,rgba(201,168,76,.065) 0%,transparent 60%);
      pointer-events:none;
    }
    .login-bg::after {
      content:''; position:absolute; inset:0; pointer-events:none;
      background-image:
        linear-gradient(rgba(201,168,76,.025) 1px,transparent 1px),
        linear-gradient(90deg,rgba(201,168,76,.025) 1px,transparent 1px);
      background-size:68px 68px;
    }
    .login-card {
      background:var(--s1); border:1px solid var(--bd2); border-radius:18px;
      padding:58px 52px; width:440px; position:relative; z-index:1;
      box-shadow:0 50px 100px rgba(0,0,0,.7),0 0 0 1px rgba(201,168,76,.07);
      animation:loginFade .6s cubic-bezier(.22,.68,0,1.2);
    }
    .login-card::before {
      content:''; position:absolute; top:-1px; left:22%; right:22%; height:2px;
      background:linear-gradient(90deg,transparent,var(--gold),transparent); border-radius:2px;
    }
    .login-sello {
      width:74px; height:74px; border:1.5px solid var(--gold); border-radius:50%;
      margin:0 auto 24px; display:flex; align-items:center; justify-content:center;
      font-family:'Playfair Display',serif; font-size:17px; color:var(--gold);
      position:relative; letter-spacing:.04em;
      box-shadow:0 0 30px rgba(201,168,76,.12),inset 0 0 20px rgba(201,168,76,.04);
    }
    .login-sello::after {
      content:''; position:absolute; inset:6px;
      border:1px solid rgba(201,168,76,.2); border-radius:50%;
    }
    .login-firma  { font-family:'Playfair Display',serif; font-size:27px; font-weight:700; text-align:center; letter-spacing:.02em; color:var(--tx); }
    .login-sub    { font-size:10.5px; color:var(--gold); text-align:center; letter-spacing:.22em; text-transform:uppercase; margin-top:5px; margin-bottom:34px; }
    .login-divider{ border:none; border-top:1px solid var(--bd2); margin:0 0 22px; }
    .login-cita   { font-family:'Georgia',serif; font-style:italic; font-size:13.5px; color:var(--tx2); text-align:center; line-height:1.75; margin-bottom:30px; }
    .login-btn {
      width:100%; padding:16px; background:linear-gradient(145deg,var(--gold3),var(--gold));
      border:none; border-radius:9px; color:#08060A; font-size:12.5px; font-weight:700;
      letter-spacing:.2em; text-transform:uppercase; transition:all .35s;
      box-shadow:0 5px 28px rgba(201,168,76,.3);
    }
    .login-btn:hover { box-shadow:0 8px 38px rgba(201,168,76,.45); transform:translateY(-2px); background:linear-gradient(145deg,var(--gold),var(--gold2)); }
    .login-btn:active{ transform:translateY(0); }
    .login-footer { text-align:center; margin-top:26px; font-size:10.5px; color:var(--tx3); letter-spacing:.04em; }

    /* ── LAYOUT ── */
    .layout { display:grid; grid-template-columns:258px 1fr 292px; height:100vh; overflow:hidden; }

    /* ── SIDEBAR ── */
    .sidebar { background:var(--s1); border-right:1px solid var(--bd2); display:flex; flex-direction:column; overflow:hidden; }
    .sb-hd   { padding:20px 16px 16px; border-bottom:1px solid var(--bd2); }
    .sb-logo { display:flex; align-items:center; gap:10px; }
    .logo-sello { width:36px;height:36px;border:1.5px solid var(--gold);border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Playfair Display',serif;font-size:10px;color:var(--gold);flex-shrink:0;letter-spacing:.03em; }
    .logo-nm { font-family:'Playfair Display',serif; font-size:13.5px; font-weight:700; color:var(--tx); }
    .logo-sb { font-size:9px; color:var(--gold); letter-spacing:.18em; text-transform:uppercase; margin-top:1px; }
    .sb-body { flex:1; overflow-y:auto; padding:10px 10px 0; }
    .sb-sec  { font-size:9px; color:var(--tx3); text-transform:uppercase; letter-spacing:.14em; padding:8px 6px 5px; }
    .stat-row{ display:flex;align-items:center;justify-content:space-between;padding:8px 12px;background:var(--s2);border-radius:7px;margin-bottom:4px; }
    .stat-lbl{ font-size:11.5px; color:var(--tx2); }
    .stat-val{ font-family:'Playfair Display',serif; font-size:21px; color:var(--tx); line-height:1; }
    .abg-row { display:flex;align-items:center;gap:9px;padding:6px 8px;border-radius:7px;cursor:pointer;transition:background .14s; }
    .abg-row:hover  { background:var(--s2); }
    .abg-row.activo { background:var(--s3); }
    .av  { width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#000;flex-shrink:0; }
    .an  { font-size:12.5px; color:var(--tx); font-weight:500; line-height:1.25; }
    .ar  { font-size:10px; color:var(--tx2); }
    .sb-ft { padding:9px 14px; border-top:1px solid var(--bd2); font-size:9.5px; color:var(--tx3); text-align:center; }

    /* ── MAIN ── */
    .main    { display:flex; flex-direction:column; overflow:hidden; background:var(--bg); }
    .main-hd { background:var(--s1); border-bottom:1px solid var(--bd2); padding:13px 18px; display:flex; align-items:center; justify-content:space-between; gap:10px; flex-shrink:0; }
    .nav-btn { width:30px;height:30px;border:1px solid var(--bd2);background:transparent;color:var(--tx2);border-radius:6px;font-size:17px;display:flex;align-items:center;justify-content:center;transition:all .2s; }
    .nav-btn:hover { border-color:var(--gold); color:var(--gold); }
    .mes-tit { font-family:'Playfair Display',serif; font-size:19px; color:var(--tx); }
    .anio-lb { font-size:13px; color:var(--tx2); margin-left:5px; }
    .hoy-btn { background:none;border:1px solid var(--bd2);border-radius:5px;color:var(--tx2);font-size:10px;padding:4px 9px;letter-spacing:.06em;transition:all .2s; }
    .hoy-btn:hover { border-color:var(--gold3); color:var(--gold); }
    .vtabs   { display:flex; gap:2px; background:var(--s2); padding:3px; border-radius:8px; }
    .vtab    { padding:5px 13px;border:none;background:transparent;color:var(--tx2);font-size:11px;font-weight:500;border-radius:6px;letter-spacing:.04em;transition:all .15s; }
    .vtab.on { background:var(--s4); color:var(--gold); }
    .vtab:hover:not(.on) { color:var(--tx); }
    .add-btn { padding:8px 16px;background:linear-gradient(135deg,var(--gold3),var(--gold));border:none;border-radius:7px;color:#08060A;font-size:12px;font-weight:700;letter-spacing:.08em;transition:all .2s; }
    .add-btn:hover { box-shadow:0 4px 20px rgba(201,168,76,.4); transform:translateY(-1px); }
    .cal-scroll { flex:1; overflow-y:auto; padding:14px; }

    /* ── GRILLA MENSUAL ── */
    .cal-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:1px; background:var(--bd2); border:1px solid var(--bd2); border-radius:10px; overflow:hidden; }
    .cal-hdr  { background:var(--s1); text-align:center; padding:9px 4px; font-size:10px; font-weight:600; text-transform:uppercase; letter-spacing:.1em; color:var(--tx2); }
    .cal-cell { background:var(--s1); min-height:108px; padding:7px; cursor:pointer; transition:background .12s; position:relative; display:flex; flex-direction:column; }
    .cal-cell:hover  { background:var(--s2); }
    .cal-cell.otra   { background:var(--bg); }
    .cal-cell.hoy    { background:var(--s2); }
    .cal-cell.hoy::after { content:''; position:absolute; top:0;left:0;right:0; height:2px; background:var(--gold); }
    .dn  { font-size:13px;font-weight:500;color:var(--tx2);width:24px;height:24px;display:flex;align-items:center;justify-content:center;border-radius:50%;margin-bottom:5px; }
    .cal-cell.hoy .dn { background:var(--gold); color:#08060A; font-weight:700; }
    .chip { padding:2px 5px;border-radius:3px;font-size:10px;color:#fff;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;transition:opacity .14s;font-weight:500; }
    .chip:hover { opacity:.8; }
    .mas  { font-size:9px; color:var(--gold); margin-top:1px; font-weight:500; cursor:pointer; }

    /* ── SEMANA ── */
    .wk-wrap { overflow-y:auto; }
    .wk-hdr  { display:grid; grid-template-columns:52px repeat(7,1fr); border-bottom:1px solid var(--bd2); position:sticky; top:0; background:var(--s1); z-index:5; }
    .wk-dhdr { padding:9px 4px; text-align:center; font-size:11px; color:var(--tx2); }
    .wk-dhdr.hoy-col { color:var(--gold); font-weight:600; }
    .wk-body { display:grid; grid-template-columns:52px repeat(7,1fr); }
    .wk-tlbl { height:56px;display:flex;align-items:flex-start;padding:4px 8px 0 0;justify-content:flex-end;font-size:9px;color:var(--tx3); }
    .wk-dcol { border-left:1px solid var(--bd2); position:relative; }
    .wk-hcel { height:56px; border-bottom:1px solid var(--bd2); cursor:pointer; transition:background .1s; }
    .wk-hcel:hover { background:rgba(201,168,76,.03); }

    /* ── DÍA ── */
    .dia-hdr { padding:10px 14px; border-bottom:1px solid var(--bd2); font-family:'Playfair Display',serif; font-size:16px; color:var(--tx); }

    /* ── LISTA ── */
    .list-view { display:flex; flex-direction:column; gap:10px; }
    .list-gt   { font-family:'Playfair Display',serif; font-size:13px; color:var(--tx2); padding:6px 0 4px; border-bottom:1px solid var(--bd2); margin-bottom:4px; }
    .list-card { background:var(--s1); border:1px solid var(--bd2); border-radius:9px; padding:12px 14px; cursor:pointer; transition:all .2s; display:flex; align-items:flex-start; gap:12px; }
    .list-card:hover { background:var(--s2); border-color:var(--bd); transform:translateX(2px); }
    .list-bar  { width:4px; border-radius:2px; min-height:36px; align-self:stretch; flex-shrink:0; }
    .list-tit  { font-size:13px; font-weight:500; color:var(--tx); margin-bottom:3px; }
    .list-meta { font-size:11px; color:var(--tx2); display:flex; gap:10px; flex-wrap:wrap; }

    /* ── PANEL DERECHO ── */
    .rpanel    { background:var(--s1); border-left:1px solid var(--bd2); display:flex; flex-direction:column; overflow:hidden; }
    .rp-tabs   { display:flex; border-bottom:1px solid var(--bd2); }
    .rptab     { flex:1;padding:12px 6px;border:none;background:transparent;color:var(--tx2);font-size:10.5px;font-weight:500;text-transform:uppercase;letter-spacing:.08em;border-bottom:2px solid transparent;transition:all .2s; }
    .rptab.on  { color:var(--gold); border-bottom-color:var(--gold); }
    .rp-body   { flex:1; overflow-y:auto; padding:14px; }
    .up-item   { padding:10px 12px;border:1px solid var(--bd2);border-radius:8px;margin-bottom:6px;cursor:pointer;transition:all .2s;position:relative; }
    .up-item:hover { background:var(--s2); }
    .up-dot    { position:absolute; top:10px; right:10px; width:7px; height:7px; border-radius:50%; }
    .up-tit    { font-size:12.5px; font-weight:500; color:var(--tx); margin-bottom:2px; padding-right:18px; line-height:1.35; }
    .up-fecha  { font-size:10.5px; color:var(--tx2); }
    .av-row    { display:flex; gap:3px; margin-top:5px; }
    .mav       { width:20px;height:20px;border-radius:50%;font-size:8px;font-weight:700;display:flex;align-items:center;justify-content:center;color:#000; }
    .al-item   { padding:11px 12px;border-radius:8px;margin-bottom:7px;border:1px solid;cursor:pointer;transition:all .2s; }
    .al-item:hover { opacity:.85; }
    .al-tit    { font-size:12.5px; font-weight:600; margin-bottom:3px; }
    .al-fecha  { font-size:11px; color:var(--tx2); }
    .al-badge  { display:inline-block;padding:2px 9px;border-radius:10px;font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin-top:5px; }
    .vacio     { text-align:center; padding:38px 16px; color:var(--tx3); }
    .vacio-ic  { font-size:32px; margin-bottom:10px; }
    .vacio-tx  { font-size:12px; }
    .al-cnt    { background:#FF4444;border-radius:50%;width:15px;height:15px;display:inline-flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;color:#fff;margin-left:4px;vertical-align:middle; }

    /* ── MODAL ── */
    .modal-ov  { position:fixed;inset:0;background:rgba(0,0,0,.8);display:flex;align-items:center;justify-content:center;z-index:100;backdrop-filter:blur(6px); }
    .modal-box { background:var(--s1);border:1px solid var(--bd);border-radius:14px;width:564px;max-height:92vh;overflow-y:auto;box-shadow:0 40px 80px rgba(0,0,0,.8);animation:fadeIn .22s ease; }
    .modal-hd  { padding:17px 22px 14px;border-bottom:1px solid var(--bd2);display:flex;align-items:center;justify-content:space-between; }
    .modal-tit { font-family:'Playfair Display',serif; font-size:17px; color:var(--tx); }
    .modal-x   { background:none;border:none;color:var(--tx2);font-size:18px;padding:4px;transition:color .2s;line-height:1; }
    .modal-x:hover { color:var(--tx); }
    .modal-bd  { padding:17px 22px; display:flex; flex-direction:column; gap:13px; }
    .modal-ft  { padding:13px 22px 17px; border-top:1px solid var(--bd2); display:flex; gap:8px; justify-content:flex-end; }
    .f-row     { display:grid; grid-template-columns:1fr 1fr; gap:11px; }
    .f-grp     { display:flex; flex-direction:column; }
    .f-lbl     { font-size:10.5px;color:var(--tx2);text-transform:uppercase;letter-spacing:.08em;display:block;margin-bottom:5px; }
    .chk-row   { display:flex;align-items:center;gap:8px;padding:7px 9px;border:1px solid var(--bd2);border-radius:6px;cursor:pointer;transition:all .14s;margin-bottom:3px; }
    .chk-row:hover { background:var(--s2); }
    .chk-row.on    { background:var(--s2); }
    .chk-lbl   { font-size:12.5px; color:var(--tx); line-height:1.2; }
    .chk-sub   { font-size:10px; color:var(--tx2); }
    .alertas-grid { display:grid; grid-template-columns:1fr 1fr; gap:3px; }
    .btn-p { padding:9px 20px;background:linear-gradient(135deg,var(--gold3),var(--gold));border:none;border-radius:7px;color:#08060A;font-size:12.5px;font-weight:700;transition:all .2s; }
    .btn-p:hover { box-shadow:0 4px 18px rgba(201,168,76,.38); }
    .btn-s { padding:9px 20px;background:transparent;border:1px solid var(--bd);border-radius:7px;color:var(--tx2);font-size:12.5px;transition:all .2s; }
    .btn-s:hover { border-color:var(--tx2); color:var(--tx); }
    .btn-d { padding:9px 20px;background:transparent;border:1px solid #B84040;border-radius:7px;color:#C44C4C;font-size:12.5px;transition:all .2s; }
    .btn-d:hover { background:rgba(180,60,60,.12); }

    /* ── TOAST ── */
    .toast { position:fixed;bottom:22px;right:22px;background:var(--s3);border:1px solid var(--gold3);border-radius:9px;padding:11px 18px;font-size:13px;color:var(--tx);z-index:200;box-shadow:0 12px 34px rgba(0,0,0,.5);animation:slideUp .3s ease;pointer-events:none; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    /* ═══════════════════════════
       CONSTANTES
    ═══════════════════════════ */
    const FIRMA = { nombre: "González & Asociados", sub: "Estudio Jurídico" };

    const ABOGADOS = [
      { id:"p",  nombre:"Dra. María González", rol:"Socia Principal",   color:"#C9A84C", ini:"MG", principal:true  },
      { id:"a1", nombre:"Dr. Carlos Mendoza",  rol:"Abogado Asociado",  color:"#5491C8", ini:"CM", principal:false },
      { id:"a2", nombre:"Dra. Ana Rivas",      rol:"Abogada Asociada",  color:"#4DAAA0", ini:"AR", principal:false },
      { id:"a3", nombre:"Dr. Pablo Torres",    rol:"Abogado Asociado",  color:"#8E6DC4", ini:"PT", principal:false },
      { id:"a4", nombre:"Dra. Laura Vega",     rol:"Abogada Asociada",  color:"#C46D6D", ini:"LV", principal:false },
    ];

    const TIPOS = [
      { id:"audiencia",   label:"Audiencia",   icon:"⚖️" },
      { id:"reunion",     label:"Reunión",     icon:"🤝" },
      { id:"vencimiento", label:"Vencimiento", icon:"⏰" },
      { id:"consulta",    label:"Consulta",    icon:"💼" },
      { id:"peritaje",    label:"Peritaje",    icon:"🔍" },
      { id:"otro",        label:"Otro",        icon:"📋" },
    ];

    const ALERTAS_OPTS = [
      { id:"72h", label:"3 días antes",   horas:72  },
      { id:"48h", label:"2 días antes",   horas:48  },
      { id:"24h", label:"1 día antes",    horas:24  },
      { id:"12h", label:"12 horas antes", horas:12  },
      { id:"3h",  label:"3 horas antes",  horas:3   },
      { id:"1h",  label:"1 hora antes",   horas:1   },
      { id:"30m", label:"30 min antes",   horas:0.5 },
    ];

    const MESES = ["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
    const DIAS  = ["Dom","Lun","Mar","Mié","Jue","Vie","Sáb"];

    /* ═══════════════════════════
       UTILIDADES
    ═══════════════════════════ */
    const genId    = () => `e_${Date.now()}_${Math.random().toString(36).slice(2,6)}`;
    const hoyStr   = () => new Date().toISOString().split("T")[0];
    const fmtFecha = (ds) => new Date(ds+"T12:00:00").toLocaleDateString("es-AR",{weekday:"long",day:"numeric",month:"long"});

    const estadoAlerta = (fecha, hora) => {
      const ahora = new Date();
      const dt    = new Date(`${fecha}T${hora||"00:00"}`);
      const h     = (dt - ahora) / 3600000;
      if (h < 0)   return null;
      if (h <= 1)  return { lvl:"critico", color:"#FF3B3B", label:"¡Menos de 1 hora!", pulso:true  };
      if (h <= 24) return { lvl:"urgente", color:"#FF6633", label:"Hoy",               pulso:true  };
      if (h <= 48) return { lvl:"alto",    color:"#FF9933", label:"Mañana",            pulso:false };
      if (h <= 72) return { lvl:"medio",   color:"#C9A84C", label:"En 2-3 días",       pulso:false };
      return null;
    };

    const colorEvento = (ev) => {
      const al = estadoAlerta(ev.date, ev.startTime);
      if (al?.lvl === "critico") return "#FF3B3B";
      if (al?.lvl === "urgente") return "#FF6633";

    /* ═══════════════════════════
       VISTA MENSUAL
    ═══════════════════════════ */
    function VistaMes({ año, mes, eventos, alDia, alEvento }) {
      const primero  = new Date(año, mes, 1).getDay();
      const dias     = new Date(año, mes+1, 0).getDate();
      const prevDias = new Date(año, mes, 0).getDate();
      const hoy      = hoyStr();

      const celdas = [];
      for (let i=primero-1; i>=0; i--) celdas.push({dia:prevDias-i, actual:false, fecha:null});
      for (let d=1; d<=dias; d++) {
        const dt = new Date(año,mes,d);
        celdas.push({dia:d, actual:true, fecha:dt.toISOString().split("T")[0]});
      }
      const resto = 42 - celdas.length;
      for (let d=1; d<=resto; d++) celdas.push({dia:d, actual:false, fecha:null});

      const evsDia = (f) => f ? eventos.filter(e=>e.date===f).sort((a,b)=>a.startTime.localeCompare(b.startTime)) : [];

      return (
        <div className="cal-grid">
          {DIAS.map(d=><div key={d} className="cal-hdr">{d}</div>)}
          {celdas.map((c,i)=>{
            const evs   = evsDia(c.fecha);
            const esHoy = c.fecha===hoy;
            return (
              <div key={i} className={`cal-cell ${!c.actual?"otra":""} ${esHoy?"hoy":""}`}
                onClick={()=>c.actual&&alDia(c.fecha)}>
                <div className="dn">{c.dia}</div>
                {evs.slice(0,3).map(ev=>(
                  <div key={ev.id} className="chip"
                    style={{background:colorEvento(ev)+"CC"}}
                    onClick={e=>{e.stopPropagation();alEvento(ev);}}
                    title={ev.title}>
                    {ev.startTime&&<span style={{opacity:.82}}>{ev.startTime} </span>}
                    {ev.title}
                  </div>
                ))}
                {evs.length>3&&<div className="mas" onClick={e=>e.stopPropagation()}>+{evs.length-3} más</div>}
              </div>
            );
          })}
        </div>
      );
    }

                <div key={i} className={`wk-dhdr ${ds===hoy?"hoy-col":""}`}>
                  <div style={{fontSize:10,textTransform:"uppercase",letterSpacing:".1em"}}>{DIAS[i]}</div>

                      <div key={h} className="wk-hcel" onClick={()=>alSlot(ds)}>

      const guardar = () => {
        if (!form.title.trim()) { alert("Por favor ingrese un título."); return; }
        if (!form.date)         { alert("Por favor seleccione una fecha."); return; }

                <div className="f-grp">
                  <label className="f-lbl">Tipo *</label>
                  <select value={form.type} onChange={e=>set("type",e.target.value)}>
                    {TIPOS.map(t=><option key={t.id} value={t.id}>{t.icon} {t.label}</option>)}

                <div className="f-grp">
                  <label className="f-lbl">Fecha *</label>
                  <input type="date" value={form.date} onChange={e=>set("date",e.target.value)}/>
                </div>
                <div className="f-grp">
                  <label className="f-lbl">Juzgado / Lugar</label>
                  <input value={form.court} onChange={e=>set("court",e.target.value)} placeholder="Juzgado Civil N°..."/>
                </div>
              </div>
              <div className="f-row">
                <div className="f-grp">
                  <label className="f-lbl">Hora Inicio *</label>
                  <input type="time" value={form.startTime} onChange={e=>set("startTime",e.target.value)}/>
                </div>
                <div className="f-grp">
                  <label className="f-lbl">Hora Fin</label>
                  <input type="time" value={form.endTime} onChange={e=>set("endTime",e.target.value)}/>
                </div>
              </div>
              <div className="f-grp">
                <label className="f-lbl">Asignar Abogados *</label>
                {ABOGADOS.map(a=>(
                  <div key={a.id}
                    className={`chk-row ${form.lawyers.includes(a.id)?"on":""}`}
                    style={{borderColor:form.lawyers.includes(a.id)?a.color+"55":undefined}}
                    onClick={()=>toggle("lawyers",a.id)}>
                    <input type="checkbox" checked={form.lawyers.includes(a.id)} onChange={()=>{}}
                      style={{accentColor:a.color,width:15,height:15,flexShrink:0}}/>
                    <div className="av" style={{background:a.color,width:26,height:26,fontSize:9.5,borderRadius:"50%",display:"flex",alignItems:"center",justifyContent:"center",color:"#000",fontWeight:700,flexShrink:0}}>{a.ini}</div>
                    <div>
                      <div className="chk-lbl">{a.nombre} {a.principal&&<span style={{color:"var(--gold)"}}>★</span>}</div>
                      <div className="chk-sub">{a.rol}</div>
                    </div>
                  </div>
                ))}
              </div>
              <div className="f-grp">
                <label className="f-lbl">⚠ Alertas y Recordatorios</label>
                <div className="alertas-grid">
                  {ALERTAS_OPTS.map(a=>(
                    <div key={a.id}
                      className={`chk-row ${form.alerts.includes(a.id)?"on":""}`}
                      onClick={()=>toggle("alerts",a.id)}>
                      <input type="checkbox" checked={form.alerts.includes(a.id)} onChange={()=>{}}
                        style={{accentColor:"var(--gold)",width:15,height:15,flexShrink:0}}/>
                      <span className="chk-lbl" style={{fontSize:12}}>{a.label}</span>
                    </div>
                  ))}
                </div>
              </div>
              <div className="f-grp">
                <label className="f-lbl">Notas / Observaciones</label>
                <textarea value={form.notes} onChange={e=>set("notes",e.target.value)}
                  placeholder="Documentación necesaria, instrucciones, observaciones..." rows={3}/>
              </div>
            </div>
            <div className="modal-ft">
              {esEdicion && !confirmarBorrar && (
                <button className="btn-d" onClick={()=>setConfirmarBorrar(true)}>🗑 Eliminar</button>
              )}
              {esEdicion && confirmarBorrar && (
                <>
                  <button className="btn-d" onClick={()=>alEliminar(form.id)}>¿Confirmar eliminación?</button>
                  <button className="btn-s" onClick={()=>setConfirmarBorrar(false)}>Cancelar</button>
                </>
              )}
              {!confirmarBorrar && (
                <>
                  <button className="btn-s" onClick={alCerrar}>Cancelar</button>
                  <button className="btn-p" onClick={guardar}>{esEdicion?"Guardar Cambios":"Crear Evento"}</button>
                </>
              )}
            </div>
          </div>
        </div>
      );
    }

    /* ═══════════════════════════
       APP PRINCIPAL
    ═══════════════════════════ */
    function App() {
      const [ingresado, setIngresado] = useState(false);
      const [eventos,   setEventos]   = useState(() => {
        try { const d=localStorage.getItem("agenda-legal-v3"); if(d) return JSON.parse(d); } catch {}
        return mkMuestras();
      });
      const [curFecha, setCurFecha] = useState(new Date());
      const [vista,    setVista]   = useState("mes");
      const [modal,    setModal]   = useState(false);
      const [editEv,   setEditEv]  = useState(null);
      const [filtro,   setFiltro]  = useState(null);
      const [rpTab,    setRpTab]   = useState("proximos");
      const [toast,    setToast]   = useState(null);

      /* Persistencia localStorage */
      useEffect(() => {
        try { localStorage.setItem("agenda-legal-v3", JSON.stringify(eventos)); } catch {}
      }, [eventos]);

      const mostrarToast = (msg) => { setToast(msg); setTimeout(()=>setToast(null), 3200); };

      const abrirNuevo  = (fecha) => { setEditEv({date:fecha||hoyStr(),lawyers:["p"],alerts:["72h","24h"],startTime:"09:00",endTime:"10:00",type:"audiencia",court:"",expNum:"",notes:""}); setModal(true); };
      const abrirEditar = (ev)    => { setEditEv(ev); setModal(true); };
      const cerrarModal = ()      => { setModal(false); setEditEv(null); };

      const guardarEvento = (ev) => {
        if (editEv?.id) { setEventos(p=>p.map(e=>e.id===ev.id?ev:e)); mostrarToast("✓ Evento actualizado"); }
        else             { setEventos(p=>[...p,ev]); mostrarToast("✓ Evento creado"); }
        cerrarModal();
      };
      const eliminarEvento = (id) => { setEventos(p=>p.filter(e=>e.id!==id)); cerrarModal(); mostrarToast("Evento eliminado"); };

      const navegar = (dir) => setCurFecha(p=>{
        const n = new Date(p);
        if      (vista==="mes")    n.setMonth(n.getMonth()+dir);
        else if (vista==="semana") n.setDate(n.getDate()+dir*7);
        else if (vista==="dia")    n.setDate(n.getDate()+dir);
        else                       n.setMonth(n.getMonth()+dir);
        return n;
      });
      const irHoy = () => setCurFecha(new Date());

      const tituloNav = () => {
        if (vista==="mes") return (
          <><span className="mes-tit">{MESES[curFecha.getMonth()]}</span><span className="anio-lb">{curFecha.getFullYear()}</span></>
        );
        if (vista==="semana") {
          const ini=new Date(curFecha); ini.setDate(curFecha.getDate()-curFecha.getDay());
          const fin=new Date(ini); fin.setDate(ini.getDate()+6);
          const mIsmo=ini.getMonth()===fin.getMonth();
          return <span className="mes-tit" style={{fontSize:16}}>{ini.getDate()}{mIsmo?"":` ${MESES[ini.getMonth()]}`} – {fin.getDate()} {MESES[fin.getMonth()]} {fin.getFullYear()}</span>;
        }
        if (vista==="dia") return <span className="mes-tit" style={{fontSize:16}}>{curFecha.toLocaleDateString("es-AR",{weekday:"short",day:"numeric",month:"long",year:"numeric"})}</span>;
        return <><span className="mes-tit">{MESES[curFecha.getMonth()]}</span><span className="anio-lb">{curFecha.getFullYear()}</span></>;
      };

      const filtrados = filtro ? eventos.filter(e=>e.lawyers?.includes(filtro)) : eventos;
      const ahora     = new Date();
      const proximos  = eventos
        .filter(e=>new Date(e.date+"T"+(e.startTime||"00:00"))>=ahora)
        .sort((a,b)=>(a.date+a.startTime).localeCompare(b.date+b.startTime))
        .slice(0,25);
      const conAlerta = proximos.filter(e=>estadoAlerta(e.date,e.startTime));

      if (!ingresado) return <Ingreso alEntrar={()=>setIngresado(true)}/>;

      return (
        <div className="layout">
          <Barra eventos={eventos} filtro={filtro} setFiltro={setFiltro}/>

          <div className="main">
            <div className="main-hd">
              <div style={{display:"flex",alignItems:"center",gap:10}}>
                <button className="nav-btn" onClick={()=>navegar(-1)}>‹</button>
                <span>{tituloNav()}</span>
                <button className="nav-btn" onClick={()=>navegar(1)}>›</button>
                <button className="hoy-btn" onClick={irHoy}>HOY</button>
              </div>
              <div className="vtabs">
                {[["mes","Mes"],["semana","Semana"],["dia","Día"],["lista","Lista"]].map(([v,l])=>(
                  <button key={v} className={`vtab ${vista===v?"on":""}`} onClick={()=>setVista(v)}>{l}</button>
                ))}
              </div>
              <button className="add-btn" onClick={()=>abrirNuevo(null)}>+ Nuevo Evento</button>
            </div>

            <div className="cal-scroll">
              {vista==="mes"    && <VistaMes    año={curFecha.getFullYear()} mes={curFecha.getMonth()} eventos={filtrados} alDia={abrirNuevo} alEvento={abrirEditar}/>}
              {vista==="semana" && <VistaSemana fecha={curFecha} eventos={filtrados} alEvento={abrirEditar} alSlot={abrirNuevo}/>}
              {vista==="dia"    && <VistaDay    fecha={curFecha} eventos={filtrados} alEvento={abrirEditar} alSlot={abrirNuevo}/>}
              {vista==="lista"  && <VistaLista  eventos={filtrados} alEvento={abrirEditar}/>}
            </div>
          </div>

          <div className="rpanel">
            <div className="rp-tabs">
              <button className={`rptab ${rpTab==="proximos"?"on":""}`} onClick={()=>setRpTab("proximos")}>Próximos</button>
              <button className={`rptab ${rpTab==="alertas"?"on":""}`} onClick={()=>setRpTab("alertas")}>
                Alertas {conAlerta.length>0&&<span className="al-cnt">{conAlerta.length}</span>}
              </button>
            </div>
            <div className="rp-body">
              {rpTab==="proximos" && <PanelProximos eventos={proximos} alEvento={abrirEditar}/>}
              {rpTab==="alertas"  && <PanelAlertas  eventos={conAlerta} alEvento={abrirEditar}/>}
            </div>
          </div>

          {modal && <ModalEvento evento={editEv} alGuardar={guardarEvento} alEliminar={eliminarEvento} alCerrar={cerrarModal}/>}
          {toast && <div className="toast">{toast}</div>}
        </div>
      );
    }

    /* ── MONTAR ── */
    const container = document.getElementById("root");
    const root = ReactDOM.createRoot(container);
    root.render(<App/>);
  </script>
</body>
</html>
