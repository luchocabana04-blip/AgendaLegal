<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Mariana Sánchez & Asociados — Suite Legal</title>
  
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#07090F">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Jost:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>

  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --bg:#07090F;--s1:#0D1120;--s2:#141C33;--s3:#1A2240;--s4:#22304C;
      --bd:#2A3860;--bd2:#1A2440;
      --gold:#C9A84C;--gold2:#E8C870;--gold3:#9B7A30;
      --tx:#DDD8CC;--tx2:#8A9AB8;--tx3:#35486A;
      --green:#3DAA6A;--red:#C94C4C;--wsp:#25D366;
      --safe-t:env(safe-area-inset-top,0px);
      --safe-b:env(safe-area-inset-bottom,0px);

      /* Colores por Tipo de Evento (SaaS Premium) */
      --c-audiencia-bg: rgba(201,168,76,0.12); --c-audiencia-bd: #C9A84C; --c-audiencia-tx: #E8C870;
      --c-reunion-bg: rgba(84,145,200,0.12);   --c-reunion-bd: #5491C8;   --c-reunion-tx: #8BB8E8;
      --c-venci-bg: rgba(201,76,76,0.12);      --c-venci-bd: #C94C4C;     --c-venci-tx: #FF8888;
      --c-comp-bg: rgba(61,170,106,0.12);      --c-comp-bd: #3DAA6A;      --c-comp-tx: #6BE09D;
      --c-otro-bg: rgba(138,154,184,0.12);     --c-otro-bd: #8A9AB8;      --c-otro-tx: #B0C4DE;
    }
    html,body,#root{height:100%; width:100%; overflow:hidden;}
    body{font-family:'Jost',sans-serif;background:var(--bg);color:var(--tx);
      padding-top:var(--safe-t);padding-bottom:var(--safe-b);-webkit-font-smoothing:antialiased}
    *{-webkit-tap-highlight-color:transparent}
    button{cursor:pointer;font-family:'Jost',sans-serif;border:none;outline:none}
    input,select,textarea{background:var(--s3);border:1px solid var(--bd2);color:var(--tx);
      font-family:'Jost',sans-serif;border-radius:6px;padding:10px 12px;width:100%;font-size:13px;outline:none;transition: border .2s}
    input:focus,select:focus,textarea:focus{border-color:var(--gold)}
    textarea{resize:vertical;min-height:70px}

    /* ANIMACIONES */
    @keyframes fadeIn{from{opacity:0}to{opacity:1}}
    @keyframes slideUp{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:translateY(0)}}
    @keyframes loginFade {from{opacity:0;transform:scale(.97) translateY(14px)}to{opacity:1;transform:scale(1) translateY(0)}}
    @keyframes spin {to{transform:rotate(360deg)}}
    .fade-in{animation:fadeIn .25s ease}

    /* SPLASH SEGURO */
    #splash{position:fixed;inset:0;background:var(--bg);z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;transition:opacity .5s ease,visibility .5s ease}
    #splash.out{opacity:0;visibility:hidden;pointer-events:none}
    .sp-spin{width:30px;height:30px;border:3px solid var(--bd);border-top-color:var(--gold);border-radius:50%;animation:spin 1s linear infinite}

    /* PANTALLA CENTRAL (LOGIN/CONFIG) */
    .pant-bg{height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);position:relative;overflow:hidden}
    .card{background:var(--s1);border:1px solid var(--bd2);border-radius:18px;padding:42px 40px;width:min(460px,calc(100vw - 36px));position:relative;z-index:1;box-shadow:0 30px 60px rgba(0,0,0,.7);animation:loginFade .4s cubic-bezier(.22,.68,0,1.2)}
    .sello{width:68px;height:68px;border:1.5px solid var(--gold);border-radius:50%;margin:0 auto 20px;display:flex;align-items:center;justify-content:center;font-family:'Playfair Display',serif;font-size:11px;color:var(--gold);text-align:center;line-height:1.3}
    .firma{font-family:'Playfair Display',serif;font-size:21px;font-weight:700;text-align:center;color:var(--tx);line-height:1.3}
    .firma-sub{font-size:10px;color:var(--gold);text-align:center;letter-spacing:.22em;text-transform:uppercase;margin-top:5px;margin-bottom:28px}
    .cita{font-family:'Georgia',serif;font-style:italic;font-size:13px;color:var(--tx2);text-align:center;line-height:1.75;margin-bottom:26px}
    .divider{border:none;border-top:1px solid var(--bd2);margin:20px 0}

    /* BOTONES PREMIUM */
    .btn-gold{padding:14px;background:linear-gradient(145deg,var(--gold3),var(--gold));
      border-radius:8px;color:#08060A;font-size:12.5px;font-weight:700;
      letter-spacing:.1em;text-transform:uppercase;transition:all .2s;
      display:inline-flex;align-items:center;justify-content:center;gap:6px;width:100%;box-shadow:0 4px 15px rgba(201,168,76,.2)}
    .btn-gold:hover:not(:disabled){transform:translateY(-1px);background:linear-gradient(145deg,var(--gold),var(--gold2));box-shadow:0 6px 20px rgba(201,168,76,.3)}
    
    .btn-p{padding:10px 18px;background:var(--gold);color:#000;font-weight:600;font-size:12px;border-radius:6px;transition:all .2s}
    .btn-p:hover{background:var(--gold2)}
    .btn-s{padding:10px 18px;background:var(--s3);color:var(--tx2);border:1px solid var(--bd2);font-size:12px;border-radius:6px;transition:all .2s}
    .btn-s:hover{background:var(--s4);color:var(--tx);border-color:var(--bd)}
    .btn-d{padding:10px 14px;background:rgba(201,76,76,0.15);color:#FF8888;border:1px solid rgba(201,76,76,0.3);font-size:12px;border-radius:6px;margin-right:auto;transition:all .2s}
    .btn-d:hover{background:rgba(201,76,76,0.25)}
    .btn-wsp{padding:8px 12px;background:rgba(37,211,102,0.15);color:var(--wsp);border:1px solid rgba(37,211,102,0.3);font-size:11.5px;border-radius:6px;display:inline-flex;align-items:center;gap:6px;font-weight:600;transition:all .2s}
    .btn-wsp:hover{background:rgba(37,211,102,0.25)}

    /* LAYOUT PRINCIPAL (ESCRITORIO) */
    .layout{display:grid;grid-template-columns:260px 1fr;height:100vh;overflow:hidden}
    
    /* SIDEBAR */
    .sidebar{background:var(--s1);border-right:1px solid var(--bd2);display:flex;flex-direction:column;overflow:hidden;z-index:10}
    .sb-hd{padding:24px 20px;border-bottom:1px solid var(--bd2);display:flex;align-items:center;gap:14px}
    .l-sello{width:42px;height:42px;border:1.5px solid var(--gold);border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Playfair Display',serif;font-size:11px;color:var(--gold)}
    .l-nm{font-family:'Playfair Display',serif;font-size:14px;font-weight:700;color:var(--tx);line-height:1.2}
    .l-sb{font-size:9.5px;color:var(--gold);letter-spacing:.15em;text-transform:uppercase}
    
    .sb-body{flex:1;overflow-y:auto;padding:16px 12px}
    .sb-sec{font-size:10px;color:var(--tx3);text-transform:uppercase;letter-spacing:.1em;padding:10px 8px 8px;display:flex;justify-content:space-between;align-items:center;font-weight:600}
    .abg-row{display:flex;align-items:center;gap:12px;padding:10px;border-radius:8px;cursor:pointer;margin-bottom:6px;transition:all .2s; border:1px solid transparent}
    .abg-row:hover{background:var(--s2)}
    .abg-row.on{background:var(--s3); border-color:var(--bd)}
    .av{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#000;flex-shrink:0;box-shadow:0 2px 5px rgba(0,0,0,.3)}
    .a-nm{font-size:13px;color:var(--tx);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    
    /* MAIN AREA & HEADER STICKY */
    .main{display:flex;flex-direction:column;overflow:hidden;background:var(--bg);position:relative}
    .main-hd{background:rgba(13, 17, 32, 0.95);backdrop-filter:blur(10px);border-bottom:1px solid var(--bd2);padding:14px 24px;display:flex;align-items:center;justify-content:space-between;gap:16px;position:sticky;top:0;z-index:20}
    .hd-left{display:flex;align-items:center;gap:12px}
    .nav-btn{width:34px;height:34px;background:var(--s2);color:var(--tx2);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:18px;transition:all .2s; border:1px solid transparent}
    .nav-btn:hover{color:var(--gold); background:var(--s3); border-color:var(--gold3)}
    .mes-tit{font-family:'Playfair Display',serif;font-size:20px;color:var(--tx);text-transform:capitalize;min-width:140px;text-align:center}
    
    .vtabs{display:flex;background:var(--s2);padding:4px;border-radius:8px; border:1px solid var(--bd2)}
    .vtab{padding:8px 16px;background:transparent;color:var(--tx2);font-size:12px;border-radius:6px;font-weight:600;transition:all .2s;letter-spacing:.05em}
    .vtab.on{background:var(--s4);color:var(--gold);box-shadow:0 2px 8px rgba(0,0,0,.2)}
    
    .cal-scroll{flex:1;overflow-y:auto;padding:20px;position:relative}

    /* CALENDARIO MES - OPTIMIZADO */
    .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--bd2);border:1px solid var(--bd2);border-radius:12px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.2)}
    .cal-hdr{background:var(--s1);text-align:center;padding:12px 4px;font-size:11.5px;color:var(--tx2);text-transform:uppercase;font-weight:600;letter-spacing:.05em}
    .cal-cell{background:var(--s1);min-height:110px;padding:8px;display:flex;flex-direction:column;cursor:pointer;transition:background .2s; overflow:hidden}
    .cal-cell:hover{background:var(--s2)}
    .cal-cell.otra{background:var(--bg);opacity:0.5}
    .cal-cell.hoy{background:var(--s2);border-top:3px solid var(--gold)}
    .dn{font-size:13px;font-weight:600;color:var(--tx2);width:24px;height:24px;display:flex;align-items:center;justify-content:center;margin-bottom:6px;border-radius:50%}
    .cal-cell.hoy .dn{background:var(--gold);color:#000}

    /* EVENT CHIPS (PREMIUM SAAS) */
    .ev-container{flex:1;display:flex;flex-direction:column;gap:4px;overflow:hidden}
    .chip{padding:5px 8px;border-radius:6px;font-size:11px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:6px;transition:transform .1s}
    .chip:hover{transform:scale(1.02)}
    .c-abg{font-size:9px;font-weight:700;padding:2px 4px;border-radius:4px;background:rgba(0,0,0,.3);letter-spacing:.05em}
    .chip-more{font-size:10px;color:var(--tx2);font-weight:600;padding-left:4px;margin-top:2px}

    /* CLASES DE TIPOS DE EVENTO */
    .type-audiencia{background:var(--c-audiencia-bg); border-left:3px solid var(--c-audiencia-bd); color:var(--c-audiencia-tx);}
    .type-reunion{background:var(--c-reunion-bg); border-left:3px solid var(--c-reunion-bd); color:var(--c-reunion-tx);}
    .type-vencimiento{background:var(--c-venci-bg); border-left:3px solid var(--c-venci-bd); color:var(--c-venci-tx);}
    .type-completado{background:var(--c-comp-bg); border-left:3px solid var(--c-comp-bd); color:var(--c-comp-tx);}
    .type-otro{background:var(--c-otro-bg); border-left:3px solid var(--c-otro-bd); color:var(--c-otro-tx);}

    /* LISTAS Y TARJETAS (VISTA DÍA/LISTA) */
    .list-card{background:var(--s1);border:1px solid var(--bd2);border-radius:12px;padding:16px;display:flex;gap:16px;margin-bottom:12px;align-items:center;transition:all .2s;box-shadow:0 4px 15px rgba(0,0,0,.15)}
    .list-card:hover{transform:translateY(-2px);border-color:var(--gold3);background:var(--s2);box-shadow:0 8px 25px rgba(0,0,0,.3)}
    .lc-time{width:60px;text-align:center;border-right:1px solid var(--bd2);padding-right:16px;flex-shrink:0}
    .lc-hs{font-size:15px;font-weight:700;color:var(--gold)}
    .lc-body{flex:1;display:flex;flex-direction:column;gap:4px}
    .lc-tit{font-size:15px;font-weight:600;color:var(--tx);display:flex;align-items:center;gap:8px}
    .lc-meta{font-size:12px;color:var(--tx2);display:flex;gap:12px;flex-wrap:wrap}
    .lc-badge{font-size:10px;padding:3px 8px;border-radius:12px;font-weight:600;text-transform:uppercase;letter-spacing:.05em}
    .lc-badge.audiencia{background:var(--c-audiencia-bg);color:var(--c-audiencia-tx)}
    .lc-badge.reunion{background:var(--c-reunion-bg);color:var(--c-reunion-tx)}
    .lc-badge.vencimiento{background:var(--c-venci-bg);color:var(--c-venci-tx)}
    .lc-badge.completado{background:var(--c-comp-bg);color:var(--c-comp-tx)}
    .lc-badge.otro{background:var(--c-otro-bg);color:var(--c-otro-tx)}

    /* VISTA SEMANA */
    .week-grid{display:flex;gap:12px;height:100%;overflow-x:auto;padding-bottom:10px;scroll-snap-type:x mandatory}
    .week-col{flex:1;min-width:160px;background:var(--s1);border:1px solid var(--bd2);border-radius:12px;display:flex;flex-direction:column;overflow:hidden;scroll-snap-align:start}
    .week-hdr{text-align:center;padding:12px;background:var(--s2);font-weight:600;color:var(--gold);border-bottom:1px solid var(--bd2);font-size:13px}
    .week-hdr span{display:block;font-size:11px;color:var(--tx2);font-weight:400;margin-top:2px}
    .week-hdr.hoy{background:var(--s3);border-bottom:2px solid var(--gold)}
    .week-body{flex:1;overflow-y:auto;padding:8px;display:flex;flex-direction:column;gap:8px}
    .w-card{background:var(--s2);border:1px solid transparent;border-radius:8px;padding:10px;cursor:pointer;transition:all .2s;position:relative;overflow:hidden}
    .w-card:hover{border-color:var(--gold3)}
    .w-time{font-size:11px;font-weight:700;margin-bottom:4px}
    .w-tit{font-size:12px;font-weight:500;color:var(--tx);line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

    /* MODALES */
    .modal-ov{position:fixed;inset:0;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;z-index:200;padding:16px;backdrop-filter:blur(6px)}
    .modal-box{background:var(--s1);border:1px solid var(--bd);border-radius:16px;width:100%;max-width:560px;max-height:90vh;display:flex;flex-direction:column;animation:slideUp .25s cubic-bezier(.22,.68,0,1.2);box-shadow:0 25px 60px rgba(0,0,0,0.8)}
    .modal-hd{padding:20px 24px;border-bottom:1px solid var(--bd2);display:flex;justify-content:space-between;align-items:center;flex-shrink:0}
    .modal-tit{font-family:'Playfair Display',serif;font-size:19px;color:var(--tx);font-weight:600}
    .modal-bd{padding:24px;overflow-y:auto;display:flex;flex-direction:column;gap:16px}
    .modal-ft{padding:16px 24px;border-top:1px solid var(--bd2);display:flex;gap:12px;justify-content:flex-end;flex-shrink:0;background:var(--s2);border-radius:0 0 16px 16px}
    
    .f-row{display:grid;grid-template-columns:1fr 1fr;gap:16px}
    .m-lbl{font-size:11.5px;color:var(--tx2);text-transform:uppercase;letter-spacing:.05em;display:block;margin-bottom:6px;font-weight:600}

    /* MOBILE NAVIGATION BAR */
    .bottom-nav{display:none;background:rgba(13,17,32,0.95);backdrop-filter:blur(10px);border-top:1px solid var(--bd2);padding:8px 12px;padding-bottom:calc(8px + var(--safe-b));justify-content:space-around;align-items:center;z-index:50;position:fixed;bottom:0;width:100%}
    .bn-item{display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--tx2);font-size:10px;text-transform:uppercase;font-weight:600;padding:4px 8px;border-radius:8px}
    .bn-item.on{color:var(--gold);background:var(--s2)}
    .bn-icon{font-size:20px;margin-bottom:2px}
    .bn-fab{background:var(--gold);color:#000;width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:26px;margin-top:-28px;box-shadow:0 6px 16px rgba(201,168,76,.4);border:4px solid var(--bg)}

    /* AJUSTES RESPONSIVE (CELULAR) */
    @media(max-width: 768px){
      .layout{grid-template-columns:1fr; height:100vh}
      .sidebar{display:none} /* Sidebar oculta, usamos el Menú Móvil */
      .bottom-nav{display:flex}
      .main{padding-bottom:calc(65px + var(--safe-b))} /* Espacio para el nav bottom */
      
      .main-hd{padding:12px 16px; flex-wrap:wrap; gap:12px}
      .vtabs{display:none} /* Ocultamos vtabs arriba en mobile, usamos nav de abajo */
      .mes-tit{font-size:18px}
      
      .cal-scroll{padding:12px}
      .cal-grid{border-radius:8px}
      .cal-hdr{padding:8px 2px; font-size:10px}
      .cal-cell{min-height:85px; padding:4px}
      .dn{width:20px; height:20px; font-size:12px; margin-bottom:4px}
      .chip{font-size:9.5px; padding:4px 5px; margin-bottom:3px}
      .c-abg{font-size:8px; padding:1px 3px}
      
      .f-row{grid-template-columns:1fr; gap:12px}
      .modal-box{border-radius:12px; max-height:85vh}
      .list-card{flex-direction:column; align-items:flex-start; gap:10px; padding:14px}
      .lc-time{border-right:none; border-bottom:1px solid var(--bd2); width:100%; text-align:left; padding-bottom:8px; display:flex; gap:10px; align-items:center}
      .btn-wsp{width:100%; justify-content:center; padding:10px}
      
      .week-col{min-width:85vw} /* En mobile, la semana ocupa casi toda la pantalla por día */
    }
    
    /* TOAST */
    .toast{position:fixed;bottom:calc(80px + var(--safe-b));left:50%;transform:translateX(-50%);background:var(--s3);border:1px solid var(--gold);border-radius:30px;padding:12px 24px;font-size:13px;font-weight:600;color:var(--tx);z-index:300;box-shadow:0 10px 30px rgba(0,0,0,.5);animation:slideUp .3s cubic-bezier(.22,.68,0,1.2);pointer-events:none}
  </style>
</head>
<body>

<div id="splash">
  <div style="font-family:'Playfair Display',serif;font-size:24px;color:var(--gold);font-weight:700">M.S. &amp; Asociados</div>
  <div style="font-size:11px;color:var(--tx2);letter-spacing:.2em;text-transform:uppercase">Suite Legal Premium</div>
  <div class="sp-spin" style="margin-top:20px"></div>
</div>

<div id="root"></div>

<script type="text/babel">
const { useState, useEffect } = React;
const { createClient } = window.supabase;

const TIPOS = [
  { id:"audiencia",   label:"Audiencia",   cls:"type-audiencia" },
  { id:"reunion",     label:"Reunión",     cls:"type-reunion" },
  { id:"vencimiento", label:"Vencimiento", cls:"type-vencimiento" },
  { id:"completado",  label:"Completado",  cls:"type-completado" },
  { id:"otro",        label:"Otro",        cls:"type-otro" }
];

const DIAS = ["Dom","Lun","Mar","Mié","Jue","Vie","Sáb"];
const MESES = ["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];

// FIX FECHAS: Generar ISO String compensando Zona Horaria (Seguro)
const toLocalISODate = (d) => {
  const z = d.getTimezoneOffset() * 60000;
  return (new Date(d - z)).toISOString().slice(0, 10);
};
const hoyStr = () => toLocalISODate(new Date());

const getLocalSafe = (key, fallback) => {
  try {
    const val = localStorage.getItem(key);
    return val ? JSON.parse(val) : fallback;
  } catch(e) { return fallback; }
};

const defAbogados = [
  { id:"p",  nombre:"Dra. Mariana Sánchez", ini:"MS", color:"#C9A84C" },
  { id:"a1", nombre:"Dr. Carlos Mendoza",   ini:"CM", color:"#5491C8" },
];

function App() {
  const [pantalla, setPantalla] = useState("login"); 
  const [sb, setSb] = useState(null);
  const [toast, setToast] = useState(null);
  
  // ESTADOS DE DATOS
  const [eventos, setEventos] = useState([]);
  const [abogados, setAbogados] = useState(() => getLocalSafe("agenda_abg", defAbogados));
  const [alertas, setAlertas] = useState(() => getLocalSafe("agenda_alerts", {email:"", wsp:""}));
  
  // ESTADOS UI
  const [vista, setVista] = useState("mes");
  const [curFecha, setCurFecha] = useState(new Date());
  const [filtroAbg, setFiltroAbg] = useState(null);
  const [modalEv, setModalEv] = useState(null);
  const [modalEquipo, setModalEquipo] = useState(false);
  const [modalAlertas, setModalAlertas] = useState(false);
  const [modalMenuMobile, setModalMenuMobile] = useState(false);
  const [loading, setLoading] = useState(false);

  useEffect(() => { localStorage.setItem("agenda_abg", JSON.stringify(abogados)); }, [abogados]);
  useEffect(() => { localStorage.setItem("agenda_alerts", JSON.stringify(alertas)); }, [alertas]);

  useEffect(() => {
    console.log("INIT");
    
    // 4) Timeout de seguridad: Si en 5 segundos no resolvió, forzamos la entrada al sistema
    const safetyTimeout = setTimeout(() => {
      console.warn("TIMEOUT DE SEGURIDAD ALCANZADO: Forzando entrada al sistema");
      const splash = document.getElementById("splash");
      if (splash && !splash.classList.contains("out")) {
        splash.classList.add("out");
      }
      setLoading(false);
      showToast("Conexión inestable. Ingresando en modo local.");
    }, 5000);

    const init = async () => {
      try {
        const url = localStorage.getItem("sb_url");
        const key = localStorage.getItem("sb_key");
        
        if (url && key) {
          console.log("SUPABASE OK");
          const client = createClient(url, key);
          setSb(client);
          // La app no se bloqueará esperando gracias a las medidas en fetchEventos
          await fetchEventos(client); 
        }
      } catch (e) {
        console.error("Error init DB:", e);
      } finally {
        console.log("LOADING END");
        clearTimeout(safetyTimeout); // Limpiamos el timeout si terminó a tiempo
        setTimeout(() => document.getElementById("splash")?.classList.add("out"), 600);
      }
    };
    
    init();
  }, []); // Dependencias vacías: Evita bucles infinitos de renderizado

  const showToast = (msg) => {
    setToast(msg);
    setTimeout(() => setToast(null), 3000);
  };

  const fetchEventos = async (client) => {
    setLoading(true);
    try {
      // 2) y 3) Promise.race para evitar que la petición a Supabase se cuelgue para siempre
      const fetchPromise = client.from("eventos").select("*");
      const timeoutPromise = new Promise((_, reject) => 
        setTimeout(() => reject(new Error("Timeout de servidor")), 4500)
      );
      
      const response = await Promise.race([fetchPromise, timeoutPromise]);
      const { data, error } = response;

      if (error) throw error;
      
      if (data) {
        setEventos(data.map(d => ({
          id: d.id, title: d.title || "Causa sin título", type: d.type || "audiencia",
          date: d.date || hoyStr(), startTime: d.start_time || "09:00",
          endTime: d.end_time || "10:00", lawyers: d.lawyers || [],
          notes: d.notes || "", court: d.court || "", expNum: d.exp_num || ""
        })));
        console.log("EVENTOS OK");
      }
    } catch(e) { 
      console.error("Error obteniendo eventos:", e.message); 
      showToast("Error de red. Mostrando datos locales disponibles.");
    } finally { 
      // 1) setLoading(false) asegurado incondicionalmente
      setLoading(false); 
    }
  };

  const guardarEv = async (f) => {
    if(!sb) return alert("Base de datos no conectada.");
    const payload = {
      id: f.id || `e_${Date.now()}`, title: f.title, type: f.type, date: f.date,
      start_time: f.startTime, end_time: f.endTime, lawyers: f.lawyers,
      notes: f.notes, court: f.court, exp_num: f.expNum
    };
    try {
      await sb.from("eventos").upsert(payload);
      setModalEv(null);
      showToast("Evento guardado correctamente.");
      fetchEventos(sb);
    } catch(e) { showToast("Error al guardar."); }
  };

  const eliminarEv = async (id) => {
    if(confirm("¿Seguro que deseas eliminar esta causa?")) {
      try { await sb.from("eventos").delete().eq("id", id); setModalEv(null); showToast("Evento eliminado."); fetchEventos(sb); } catch(e) {}
    }
  };

  // CERRAR SESIÓN SEGURA
  const cerrarSesion = () => {
    setPantalla("login");
    setFiltroAbg(null);
    setVista("mes");
    setModalMenuMobile(false);
  };

  // OBTENER DÍAS DE LA SEMANA ACTUAL
  const getWeekDays = (date) => {
    const d = new Date(date);
    const day = d.getDay();
    const diff = d.getDate() - day; // Domingo como primer día
    const sunday = new Date(d.setDate(diff));
    return Array.from({length: 7}).map((_, i) => {
        const nd = new Date(sunday);
        nd.setDate(sunday.getDate() + i);
        return nd;
    });
  };

  // VISTAS
  const renderCalendario = () => {
    const filtrados = filtroAbg ? eventos.filter(e=>e.lawyers?.includes(filtroAbg)) : eventos;
    
    // --- VISTA MES ---
    if(vista === "mes") {
      const año = curFecha.getFullYear(); const mes = curFecha.getMonth();
      const pri = new Date(año,mes,1).getDay(); const dias = new Date(año,mes+1,0).getDate();
      const prev = new Date(año,mes,0).getDate();
      const cels = [];
      for(let i=pri-1;i>=0;i--) cels.push({d:prev-i,otra:true,m:mes-1});
      for(let i=1;i<=dias;i++) cels.push({d:i,otra:false,m:mes});
      while(cels.length % 7 !== 0) cels.push({d:cels.length-dias-pri+1,otra:true,m:mes+1});

      return (
        <div className="cal-grid fade-in">
          {DIAS.map(d=><div key={d} className="cal-hdr">{d}</div>)}
          {cels.map((c,idx)=>{
            const ds = `${año}-${String(c.m+1).padStart(2,"0")}-${String(c.d).padStart(2,"0")}`;
            const des = filtrados.filter(e=>e.date===ds).sort((a,b)=>a.startTime.localeCompare(b.startTime));
            const isHoy = ds === hoyStr();
            const MAX_VISIBLES = 2;
            const visibles = des.slice(0, MAX_VISIBLES);
            const extra = des.length - MAX_VISIBLES;

            return (
              <div key={idx} className={`cal-cell ${c.otra?"otra":""} ${isHoy?"hoy":""}`} onClick={()=>!c.otra && (setCurFecha(new Date(ds+"T12:00:00")), setVista("dia"))}>
                <div className="dn">{c.d}</div>
                <div className="ev-container">
                  {visibles.map(e=>{
                    const abg = abogados.find(a=>a.id===(e.lawyers?.[0]));
                    const tObj = TIPOS.find(t=>t.id===e.type) || TIPOS[4];
                    return (
                      <div key={e.id} className={`chip ${tObj.cls}`} onClick={(x)=>{x.stopPropagation(); setModalEv(e);}}>
                        <span className="c-abg" style={{color: tObj.cls==='type-audiencia'?'#C9A84C':'#FFF'}}>{abg?abg.ini:'??'}</span>
                        {e.title}
                      </div>
                    )
                  })}
                  {extra > 0 && <div className="chip-more">+{extra} más</div>}
                </div>
              </div>
            );
          })}
        </div>
      );
    }

    // --- VISTA SEMANA ---
    if(vista === "semana") {
      const weekDays = getWeekDays(curFecha);
      return (
        <div className="week-grid fade-in">
           {weekDays.map(wd => {
               const ds = toLocalISODate(wd);
               const dayEvs = filtrados.filter(e=>e.date===ds).sort((a,b)=>a.startTime.localeCompare(b.startTime));
               const isHoy = ds === hoyStr();
               return (
                   <div className="week-col" key={ds}>
                      <div className={`week-hdr ${isHoy?"hoy":""}`}>
                        {DIAS[wd.getDay()]} <span>{wd.getDate()} {MESES[wd.getMonth()].substring(0,3)}</span>
                      </div>
                      <div className="week-body">
                         {dayEvs.map(ev => {
                            const tObj = TIPOS.find(t=>t.id===ev.type) || TIPOS[4];
                            return (
                              <div key={ev.id} className={`w-card ${tObj.cls}`} onClick={()=>setModalEv(ev)}>
                                 <div className="w-time" style={{color:'inherit'}}>{ev.startTime}</div>
                                 <div className="w-tit">{ev.title}</div>
                              </div>
                            )
                         })}
                         {dayEvs.length===0 && <div style={{textAlign:'center', fontSize:11, color:'var(--tx3)', marginTop:10}}>Libre</div>}
                      </div>
                   </div>
               )
           })}
        </div>
      )
    }

    // --- VISTA DÍA ---
    if(vista === "dia") {
      const ds = toLocalISODate(curFecha);
      const dEvs = filtrados.filter(e=>e.date===ds).sort((a,b)=>a.startTime.localeCompare(b.startTime));
      return (
        <div className="fade-in">
          <div style={{fontSize:18, fontWeight:600, marginBottom:20, paddingBottom:12, borderBottom:"1px solid var(--bd2)", color:"var(--gold)"}}>
            {curFecha.toLocaleDateString("es-AR",{weekday:"long",day:"numeric",month:"long", year:"numeric"})}
          </div>
          {dEvs.length===0 ? <div style={{textAlign:"center", color:"var(--tx3)", padding:40, background:"var(--s1)", borderRadius:12, border:"1px dashed var(--bd2)"}}>Sin compromisos programados para este día.</div> : 
            dEvs.map(ev=>{
               const tObj = TIPOS.find(t=>t.id===ev.type) || TIPOS[4];
               const abg = abogados.find(a=>a.id===(ev.lawyers?.[0]));
               return (
                  <div key={ev.id} className="list-card" onClick={()=>setModalEv(ev)}>
                    <div className="lc-time">
                       <div className="lc-hs">{ev.startTime}</div>
                       <div style={{fontSize:11, color:'var(--tx2)', marginTop:2}}>Hs.</div>
                    </div>
                    <div className="lc-body">
                      <div className="lc-tit">{ev.title} <span className={`lc-badge ${tObj.id}`}>{tObj.label}</span></div>
                      <div className="lc-meta">
                         <span>⚖️ {ev.court||"S/D"}</span>
                         <span>📁 Exp: {ev.expNum||"S/D"}</span>
                         <span style={{color:abg?.color}}>👤 {abg?.nombre||"Sin Asignar"}</span>
                      </div>
                    </div>
                  </div>
               )
            })
          }
        </div>
      );
    }

    // --- VISTA LISTA ---
    if(vista === "lista") {
      const allEvs = [...filtrados].sort((a,b)=>a.date.localeCompare(b.date));
      return (
        <div className="fade-in">
          {allEvs.map(ev=>{
            const tObj = TIPOS.find(t=>t.id===ev.type) || TIPOS[4];
            const dStr = new Date(ev.date+"T12:00:00").toLocaleDateString("es-AR",{day:"2-digit",month:"short"});
            return (
              <div key={ev.id} className="list-card" onClick={()=>setModalEv(ev)}>
                <div className="lc-time" style={{width:80}}>
                   <div style={{fontSize:13, color:'var(--tx)'}}>{dStr}</div>
                   <div className="lc-hs" style={{fontSize:14}}>{ev.startTime}</div>
                </div>
                <div className="lc-body">
                  <div className="lc-tit">{ev.title} <span className={`lc-badge ${tObj.id}`}>{tObj.label}</span></div>
                  <div className="lc-meta">Exp: {ev.expNum||"S/D"} | Juzgado: {ev.court||"S/D"}</div>
                </div>
              </div>
            )
          })}
        </div>
      );
    }
  };

  // PANTALLAS DE ACCESO
  if (pantalla === "config") {
    return (
      <div className="pant-bg fade-in" style={{padding:20}}>
        <div className="card" style={{width:"100%", maxWidth:420, textAlign:"center"}}>
          <h2 style={{color:"var(--gold)", marginBottom:10}}>Conectar Base de Datos</h2>
          <p style={{fontSize:13, color:"var(--tx2)", marginBottom:20, lineHeight:1.5}}>Ingresa las credenciales de Supabase del estudio para habilitar la sincronización en tiempo real.</p>
          <input id="inUrl" placeholder="URL del Proyecto (https://...)" defaultValue={localStorage.getItem("sb_url")} style={{marginBottom:12}}/>
          <input id="inKey" type="password" placeholder="Anon Key" defaultValue={localStorage.getItem("sb_key")} style={{marginBottom:24}}/>
          
          <button className="btn-gold" style={{marginBottom:12}} onClick={()=>{
            const u = document.getElementById("inUrl").value;
            const k = document.getElementById("inKey").value;
            if(!u || !k) return alert("Completa ambos campos.");
            localStorage.setItem("sb_url", u);
            localStorage.setItem("sb_key", k);
            window.location.reload();
          }}>Guardar y Conectar</button>
          
          <button className="btn-s" style={{width:"100%"}} onClick={()=>setPantalla("login")}>Volver</button>

          <hr className="divider"/>
          <button style={{background:"none", color:"var(--red)", fontSize:12, textDecoration:"underline"}} onClick={()=>{
             if(confirm("¿Borrar credenciales de este dispositivo?")) {
                localStorage.removeItem("sb_url"); localStorage.removeItem("sb_key"); setPantalla("login");
             }
          }}>Limpiar Credenciales</button>
        </div>
      </div>
    );
  }

  if (pantalla === "login") {
    const isConfigured = localStorage.getItem("sb_url") !== null;
    return (
      <div className="pant-bg fade-in" style={{padding:20}}>
        <div className="card">
          <div className="sello">M.S.<br/>&amp;A.</div>
          <div className="firma">MARIANA SÁNCHEZ<br/>&amp; ASOCIADOS</div>
          <div className="firma-sub">Estudio Jurídico Premium</div>
          <hr className="divider"/>
          <p className="cita">"La justicia y la diligencia procesal sostienen la solidez del bufete corporativo."</p>
          
          {isConfigured ? (
             <button className="btn-gold" onClick={()=>setPantalla("app")} style={{marginBottom: 16, padding:'16px'}}>INGRESAR AL SISTEMA</button>
          ) : (
             <button className="btn-s" onClick={()=>setPantalla("config")} style={{marginBottom: 16, width:'100%', borderColor:'var(--gold)', color:'var(--gold)'}}>VINCULAR DISPOSITIVO</button>
          )}
          
          {isConfigured && <button style={{background:"none", color:"var(--tx2)", fontSize:12, width:"100%", textDecoration:"underline"}} onClick={()=>setPantalla("config")}>Reconfigurar Servidor</button>}
        </div>
      </div>
    );
  }

  // INTERFAZ PRINCIPAL APP
  return (
    <div className="layout fade-in">
      
      {/* SIDEBAR PC */}
      <div className="sidebar">
        <div className="sb-hd">
          <div className="l-sello">M.S.</div>
          <div><div className="l-nm">Mariana Sánchez</div><div className="l-sb">Suite Legal</div></div>
        </div>
        <div className="sb-body">
          <div className="sb-sec"><span>Miembros del Estudio</span> <button style={{background:"none", color:"var(--gold)", fontSize:16}} onClick={()=>setModalEquipo(true)}>⚙️</button></div>
          <div className={`abg-row ${filtroAbg===null?"on":""}`} onClick={()=>setFiltroAbg(null)}>
            <div className="av" style={{background:"var(--s4)",color:"var(--tx)"}}>∀</div><div className="a-nm">Todo el Bufete</div>
          </div>
          {abogados.map(a=>(
            <div key={a.id} className={`abg-row ${filtroAbg===a.id?"on":""}`} onClick={()=>setFiltroAbg(a.id)}>
              <div className="av" style={{background:a.color}}>{a.ini}</div><div className="a-nm">{a.nombre}</div>
            </div>
          ))}
        </div>
        <div style={{padding:16, borderTop:"1px solid var(--bd2)", display:"flex", flexDirection:"column", gap:10, background:"var(--s1)"}}>
          <button className="btn-s" style={{width:"100%"}} onClick={()=>setModalAlertas(true)}>🔔 Alertas WhatsApp</button>
          <button className="btn-s" style={{width:"100%", color:"var(--red)", borderColor:"var(--red)"}} onClick={cerrarSesion}>🚪 Cerrar Sesión</button>
        </div>
      </div>

      {/* MAIN AREA */}
      <div className="main">
        <div className="main-hd">
          <div className="hd-left">
            <button className="nav-btn" onClick={()=>setCurFecha(new Date(curFecha.getFullYear(), curFecha.getMonth(), curFecha.getDate() - (vista==='mes'?30:7)))}>‹</button>
            <div className="mes-tit">
               {vista==='semana' ? `${MESES[curFecha.getMonth()]} ${curFecha.getFullYear()}` : `${MESES[curFecha.getMonth()]} ${curFecha.getFullYear()}`}
            </div>
            <button className="nav-btn" onClick={()=>setCurFecha(new Date(curFecha.getFullYear(), curFecha.getMonth(), curFecha.getDate() + (vista==='mes'?30:7)))}>›</button>
            <button className="nav-btn" style={{background:"transparent", color:"var(--gold)", width:"auto", padding:"0 12px", border:"1px solid var(--gold3)"}} onClick={()=>setCurFecha(new Date())}>HOY</button>
          </div>
          
          <div className="vtabs">
            {[
              {id:"mes", label:"MES"},
              {id:"semana", label:"SEMANA"},
              {id:"dia", label:"DÍA"},
              {id:"lista", label:"LISTA"}
            ].map(v=><button key={v.id} className={`vtab ${vista===v.id?"on":""}`} onClick={()=>setVista(v.id)}>{v.label}</button>)}
          </div>
        </div>

        <div className="cal-scroll">
          {loading ? <div style={{textAlign:"center", padding:40}}><div className="sp-spin" style={{margin:"0 auto"}}></div></div> : renderCalendario()}
        </div>
      </div>

      {/* BOTTOM NAV (MOBILE) */}
      <div className="bottom-nav">
        <div className={`bn-item ${vista==="mes"?"on":""}`} onClick={()=>setVista("mes")}><span className="bn-icon">📅</span>Mes</div>
        <div className={`bn-item ${vista==="semana"?"on":""}`} onClick={()=>setVista("semana")}><span className="bn-icon">🗓️</span>Semana</div>
        <div className="bn-item" onClick={()=>{setModalEv({date:hoyStr()})}}><div className="bn-fab">+</div></div>
        <div className={`bn-item ${vista==="lista"?"on":""}`} onClick={()=>setVista("lista")}><span className="bn-icon">📋</span>Lista</div>
        <div className="bn-item" onClick={()=>setModalMenuMobile(true)}><span className="bn-icon">☰</span>Menú</div>
      </div>

      {/* MODAL MENU MOBILE */}
      {modalMenuMobile && (
        <div className="modal-ov" style={{alignItems:'flex-end', padding:0}} onClick={e=>e.target===e.currentTarget&&setModalMenuMobile(false)}>
          <div className="modal-box" style={{borderBottomLeftRadius:0, borderBottomRightRadius:0, width:'100%', margin:0, paddingBottom:var(--safe-b)}}>
            <div className="modal-hd"><div className="modal-tit">Menú del Estudio</div><button style={{background:'none',color:'var(--tx2)',fontSize:20}} onClick={()=>setModalMenuMobile(false)}>✕</button></div>
            <div className="modal-bd" style={{gap:16}}>
                <button className="btn-s" style={{width:'100%', textAlign:'left', padding:'16px', fontSize:14}} onClick={()=>{setModalMenuMobile(false); setModalEquipo(true);}}>👥 Gestión de Abogados</button>
                <button className="btn-s" style={{width:'100%', textAlign:'left', padding:'16px', fontSize:14}} onClick={()=>{setModalMenuMobile(false); setModalAlertas(true);}}>🔔 Configurar Alertas WSP</button>
                <hr className="divider" style={{margin:'0', borderColor:'var(--bd2)'}}/>
                <button className="btn-s" style={{width:'100%', textAlign:'left', padding:'16px', fontSize:14, color:'var(--red)', borderColor:'var(--red)'}} onClick={cerrarSesion}>🚪 Cerrar Sesión Segura</button>
            </div>
          </div>
        </div>
      )}

      {/* MODAL EVENTO */}
      {modalEv && (
        <div className="modal-ov" onClick={e=>e.target===e.currentTarget&&setModalEv(null)}>
          <div className="modal-box">
            <div className="modal-hd">
              <div className="modal-tit">{modalEv.id ? "Editar Causa" : "Nueva Causa / Evento"}</div>
              <button style={{background:"none", color:"var(--tx2)", fontSize:22}} onClick={()=>setModalEv(null)}>✕</button>
            </div>
            <div className="modal-bd">
              <div className="f-grp"><label className="m-lbl">Carátula *</label><input defaultValue={modalEv.title} id="ev_t" placeholder="Ej: Perez c/ Gómez s/ Daños"/></div>
              
              <div className="f-row">
                <div className="f-grp">
                  <label className="m-lbl">Tipo de Evento</label>
                  <select id="ev_type" defaultValue={modalEv.type || "audiencia"}>
                    {TIPOS.map(t=><option key={t.id} value={t.id}>{t.label}</option>)}
                  </select>
                </div>
                <div className="f-grp">
                  <label className="m-lbl">Abogado Asignado</label>
                  <select id="ev_abg" defaultValue={modalEv.lawyers?.[0]||"p"}>
                    {abogados.map(a=><option key={a.id} value={a.id}>{a.nombre}</option>)}
                  </select>
                </div>
              </div>

              <div className="f-row">
                <div className="f-grp"><label className="m-lbl">N° Expediente</label><input defaultValue={modalEv.expNum} id="ev_exp"/></div>
                <div className="f-grp"><label className="m-lbl">Juzgado / Fuero</label><input defaultValue={modalEv.court} id="ev_c"/></div>
              </div>
              <div className="f-row">
                <div className="f-grp"><label className="m-lbl">Fecha</label><input type="date" defaultValue={modalEv.date} id="ev_d"/></div>
                <div className="f-grp"><label className="m-lbl">Hora de Inicio</label><input type="time" defaultValue={modalEv.startTime||"09:00"} id="ev_h"/></div>
              </div>
              
              <div className="f-grp"><label className="m-lbl">Anotaciones Privadas</label><textarea defaultValue={modalEv.notes} id="ev_n" placeholder="Links a Zoom, detalles del cliente..."/></div>
            </div>
            <div className="modal-ft">
              {modalEv.id && <button className="btn-d" onClick={()=>eliminarEv(modalEv.id)}>Eliminar</button>}
              <button className="btn-s" onClick={()=>setModalEv(null)}>Cancelar</button>
              <button className="btn-p" onClick={()=>guardarEv({
                ...modalEv, title:document.getElementById("ev_t").value, type:document.getElementById("ev_type").value,
                expNum:document.getElementById("ev_exp").value, court:document.getElementById("ev_c").value, 
                date:document.getElementById("ev_d").value, startTime:document.getElementById("ev_h").value, 
                lawyers:[document.getElementById("ev_abg").value], notes:document.getElementById("ev_n").value
              })}>Guardar Causa</button>
            </div>
          </div>
        </div>
      )}

      {/* MODAL EQUIPO */}
      {modalEquipo && (
        <div className="modal-ov" onClick={e=>e.target===e.currentTarget&&setModalEquipo(false)}>
          <div className="modal-box">
            <div className="modal-hd"><div className="modal-tit">Gestión de Abogados</div><button style={{background:"none",color:"var(--tx2)", fontSize:22}} onClick={()=>setModalEquipo(false)}>✕</button></div>
            <div className="modal-bd">
              {abogados.map((a)=>(
                <div key={a.id} style={{display:"flex", gap:12, alignItems:"center", background:"var(--s2)", padding:12, borderRadius:10, border:"1px solid var(--bd2)"}}>
                  <div className="av" style={{background:a.color}}>{a.ini}</div>
                  <div style={{flex:1, fontSize:14, fontWeight:500}}>{a.nombre}</div>
                  <button className="btn-d" style={{padding:"6px 12px", marginRight:0}} onClick={()=>{
                    if(confirm("¿Eliminar a "+a.nombre+" del estudio?")) setAbogados(abogados.filter(x=>x.id!==a.id));
                  }}>Borrar</button>
                </div>
              ))}
              <div style={{borderTop:"1px solid var(--bd2)", paddingTop:20, marginTop:8}}>
                <div style={{fontSize:13, color:"var(--gold)", marginBottom:14, fontWeight:"700", textTransform:"uppercase"}}>+ Nuevo Miembro</div>
                <div className="f-grp" style={{marginBottom:12}}><input id="n_nom" placeholder="Nombre completo (ej: Dr. Juan Pérez)"/></div>
                <div className="f-row">
                  <div className="f-grp"><input id="n_ini" placeholder="Iniciales (ej: JP)" maxLength={3}/></div>
                  <div className="f-grp">
                    <select id="n_col">
                      <option value="#C9A84C">Socio (Dorado)</option>
                      <option value="#5491C8">Asociado (Azul)</option>
                      <option value="#3DAA6A">Junior (Verde)</option>
                      <option value="#8E6DC4">Especial (Violeta)</option>
                    </select>
                  </div>
                </div>
                <button className="btn-s" style={{width:"100%", marginTop:12}} onClick={()=>{
                  const nom = document.getElementById("n_nom").value; const ini = document.getElementById("n_ini").value;
                  if(!nom || !ini) return alert("Completa nombre e iniciales.");
                  setAbogados([...abogados, {id:"a_"+Date.now(), nombre:nom, ini:ini.toUpperCase(), color:document.getElementById("n_col").value}]);
                  document.getElementById("n_nom").value = ""; document.getElementById("n_ini").value = "";
                }}>Añadir al Equipo</button>
              </div>
            </div>
          </div>
        </div>
      )}

      {/* MODAL ALERTAS WSP */}
      {modalAlertas && (
        <div className="modal-ov" onClick={e=>e.target===e.currentTarget&&setModalAlertas(false)}>
          <div className="modal-box">
            <div className="modal-hd"><div className="modal-tit">Alertas y Notificaciones</div><button style={{background:"none",color:"var(--tx2)", fontSize:22}} onClick={()=>setModalAlertas(false)}>✕</button></div>
            <div className="modal-bd">
              <p style={{fontSize:13, color:"var(--tx2)", lineHeight:1.6}}>Configura el número principal para el envío de recordatorios por WhatsApp a clientes o asistentes.</p>
              <div className="f-grp">
                <label className="m-lbl">Número WhatsApp</label>
                <input value={alertas.wsp} onChange={e=>setAlertas({...alertas, wsp:e.target.value})} placeholder="Ej: 5491123456789"/>
              </div>
              <button className="btn-wsp" style={{justifyContent:"center", padding:"14px", fontSize:13, width:"100%", marginTop:8}} onClick={()=>{
                if(!alertas.wsp) return alert("Ingresa un número primero.");
                window.open(`https://wa.me/${alertas.wsp.replace(/[^0-9]/g,'')}?text=Prueba%20de%20conexion%20-%20Mariana%20Sanchez%20y%20Asociados`, '_blank');
              }}>Probar Conexión WhatsApp</button>
            </div>
            <div className="modal-ft"><button className="btn-p" onClick={()=>setModalAlertas(false)}>Guardar y Cerrar</button></div>
          </div>
        </div>
      )}

      {/* TOAST NOTIFICATIONS */}
      {toast && <div className="toast">{toast}</div>}

    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root")); 
root.render(<App />);
</script>
</body>
</html>
