<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Mariana Sánchez & Asociados — Suite Legal</title>
  
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#07090F">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
  
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --bg:#07090F;--s1:#0D1120;--s2:#141C33;--s3:#1A2240;--s4:#22304C;
      --bd:#2A3860;--bd2:#1A2440;
      --gold:#C9A84C;--gold2:#E8C870;--gold3:#9B7A30;
      --tx:#DDD8CC;--tx2:#8A9AB8;--tx3:#35486A;
      --green:#3DAA6A;--red:#C94C4C;--wsp:#25D366;
      --safe-t:env(safe-area-inset-top,0px);
      --safe-b:env(safe-area-inset-bottom,0px);
    }
    html,body,#root{height:100%; width:100%; overflow:hidden;}
    body{font-family:'Jost',sans-serif;background:var(--bg);color:var(--tx);
      padding-top:var(--safe-t);padding-bottom:var(--safe-b);-webkit-font-smoothing:antialiased}
    *{-webkit-tap-highlight-color:transparent}
    button{cursor:pointer;font-family:'Jost',sans-serif;border:none;outline:none}
    input,select,textarea{background:var(--s3);border:1px solid var(--bd2);color:var(--tx);
      font-family:'Jost',sans-serif;border-radius:6px;padding:10px 12px;width:100%;font-size:13px;outline:none}
    input:focus,select:focus,textarea:focus{border-color:var(--gold)}
    textarea{resize:vertical;min-height:70px}

    /* ANIMACIONES */
    @keyframes fadeIn{from{opacity:0}to{opacity:1}}
    @keyframes slideUp{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:translateY(0)}}
    @keyframes loginFade {from{opacity:0;transform:scale(.97) translateY(14px)}to{opacity:1;transform:scale(1) translateY(0)}}
    @keyframes spin {to{transform:rotate(360deg)}}
    .fade-in{animation:fadeIn .25s ease}

    /* SPLASH SEGURO */
    #splash{position:fixed;inset:0;background:var(--bg);z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;transition:opacity .5s ease,visibility .5s ease}
    #splash.out{opacity:0;visibility:hidden;pointer-events:none}
    .sp-spin{width:30px;height:30px;border:3px solid var(--bd);border-top-color:var(--gold);border-radius:50%;animation:spin 1s linear infinite}

    /* PANTALLA CENTRAL (LOGIN/CONFIG) */
    .pant-bg{height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);position:relative;overflow:hidden}
    .card{background:var(--s1);border:1px solid var(--bd2);border-radius:18px;padding:42px 40px;width:min(460px,calc(100vw - 36px));position:relative;z-index:1;box-shadow:0 50px 100px rgba(0,0,0,.72);animation:loginFade .4s cubic-bezier(.22,.68,0,1.2)}
    .sello{width:68px;height:68px;border:1.5px solid var(--gold);border-radius:50%;margin:0 auto 20px;display:flex;align-items:center;justify-content:center;font-family:'Playfair Display',serif;font-size:11px;color:var(--gold);text-align:center;line-height:1.3}
    .firma{font-family:'Playfair Display',serif;font-size:21px;font-weight:700;text-align:center;color:var(--tx);line-height:1.3}
    .firma-sub{font-size:10px;color:var(--gold);text-align:center;letter-spacing:.22em;text-transform:uppercase;margin-top:5px;margin-bottom:28px}
    .cita{font-family:'Georgia',serif;font-style:italic;font-size:13px;color:var(--tx2);text-align:center;line-height:1.75;margin-bottom:26px}

    /* BOTONES PREMIUM */
    .btn-gold{padding:14px;background:linear-gradient(145deg,var(--gold3),var(--gold));
      border-radius:8px;color:#08060A;font-size:12.5px;font-weight:700;
      letter-spacing:.1em;text-transform:uppercase;transition:all .2s;
      display:inline-flex;align-items:center;justify-content:center;gap:6px;width:100%;box-shadow:0 4px 15px rgba(201,168,76,.2)}
    .btn-gold:hover:not(:disabled){transform:translateY(-1px);background:linear-gradient(145deg,var(--gold),var(--gold2))}
    
    .btn-p{padding:10px 18px;background:var(--gold);color:#000;font-weight:600;font-size:12px;border-radius:6px;transition:all .2s}
    .btn-p:hover{background:var(--gold2)}
    .btn-s{padding:10px 18px;background:var(--s3);color:var(--tx2);border:1px solid var(--bd2);font-size:12px;border-radius:6px;transition:all .2s}
    .btn-s:hover{background:var(--s4);color:var(--tx)}
    .btn-d{padding:10px 14px;background:rgba(201,76,76,0.15);color:#FF8888;border:1px solid rgba(201,76,76,0.3);font-size:12px;border-radius:6px;margin-right:auto}
    .btn-wsp{padding:6px 10px;background:rgba(37,211,102,0.15);color:var(--wsp);border:1px solid rgba(37,211,102,0.3);font-size:11.5px;border-radius:6px;display:inline-flex;align-items:center;gap:6px;font-weight:600;transition:all .2s}
    .btn-wsp:hover{background:rgba(37,211,102,0.25)}

    /* LAYOUT PRINCIPAL (ESCRITORIO) */
    .layout{display:grid;grid-template-columns:250px 1fr;height:100vh;overflow:hidden}
    
    /* SIDEBAR */
    .sidebar{background:var(--s1);border-right:1px solid var(--bd2);display:flex;flex-direction:column;overflow:hidden;z-index:10}
    .sb-hd{padding:20px 16px;border-bottom:1px solid var(--bd2);display:flex;align-items:center;gap:12px}
    .l-sello{width:40px;height:40px;border:1.5px solid var(--gold);border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Playfair Display',serif;font-size:10px;color:var(--gold)}
    .l-nm{font-family:'Playfair Display',serif;font-size:13px;font-weight:700;color:var(--tx);line-height:1.2}
    .l-sb{font-size:9px;color:var(--gold);letter-spacing:.15em;text-transform:uppercase}
    
    .sb-body{flex:1;overflow-y:auto;padding:12px}
    .sb-sec{font-size:10px;color:var(--tx3);text-transform:uppercase;letter-spacing:.1em;padding:10px 8px 6px;display:flex;justify-content:space-between;align-items:center}
    .abg-row{display:flex;align-items:center;gap:10px;padding:8px;border-radius:8px;cursor:pointer;margin-bottom:4px;transition:background .2s}
    .abg-row:hover, .abg-row.on{background:var(--s2)}
    .av{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#000;flex-shrink:0}
    .a-nm{font-size:12px;color:var(--tx);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    
    /* MAIN AREA */
    .main{display:flex;flex-direction:column;overflow:hidden;background:var(--bg)}
    .main-hd{background:var(--s1);border-bottom:1px solid var(--bd2);padding:14px 18px;display:flex;align-items:center;justify-content:space-between;gap:10px}
    .nav-btn{width:32px;height:32px;background:var(--s2);color:var(--tx2);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:18px;transition:all .2s}
    .nav-btn:hover{color:var(--gold); border:1px solid var(--gold)}
    .mes-tit{font-family:'Playfair Display',serif;font-size:18px;color:var(--tx);text-transform:capitalize}
    
    .vtabs{display:flex;background:var(--s2);padding:4px;border-radius:8px}
    .vtab{padding:6px 14px;background:transparent;color:var(--tx2);font-size:12px;border-radius:6px;font-weight:500;transition:all .2s}
    .vtab.on{background:var(--s4);color:var(--gold)}
    
    .cal-scroll{flex:1;overflow-y:auto;padding:14px;position:relative}

    /* CALENDARIO MES */
    .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--bd2);border:1px solid var(--bd2);border-radius:10px;overflow:hidden}
    .cal-hdr{background:var(--s1);text-align:center;padding:10px 4px;font-size:11px;color:var(--tx2);text-transform:uppercase;font-weight:600}
    .cal-cell{background:var(--s1);min-height:95px;padding:6px;display:flex;flex-direction:column;cursor:pointer;transition:background .2s}
    .cal-cell:hover{background:var(--s2)}
    .cal-cell.otra{background:var(--bg);opacity:0.6}
    .cal-cell.hoy{background:var(--s2);border-top:2px solid var(--gold)}
    .dn{font-size:12px;font-weight:600;color:var(--tx2);width:22px;height:22px;display:flex;align-items:center;justify-content:center;margin-bottom:4px}
    .cal-cell.hoy .dn{background:var(--gold);color:#000;border-radius:50%}
    .chip{padding:3px 4px;border-radius:4px;font-size:9.5px;color:#fff;margin-bottom:3px;white-space:normal;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;line-height:1.15;word-break:break-word}

    /* LISTAS / TARJETAS */
    .list-card{background:var(--s1);border:1px solid var(--bd2);border-radius:10px;padding:14px;display:flex;gap:12px;margin-bottom:10px;align-items:center;transition:all .2s}
    .list-card:hover{background:var(--s2);border-color:var(--gold3)}
    .list-bar{width:4px;border-radius:2px;align-self:stretch}
    .list-tit{font-size:14px;font-weight:600;color:var(--tx);margin-bottom:4px}
    .list-meta{font-size:12px;color:var(--tx2)}

    /* MODALES OPTIMIZADOS */
    .modal-ov{position:fixed;inset:0;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;z-index:200;padding:14px;backdrop-filter:blur(4px)}
    .modal-box{background:var(--s1);border:1px solid var(--bd);border-radius:16px;width:100%;max-width:540px;max-height:92vh;display:flex;flex-direction:column;animation:slideUp .25s ease;box-shadow:0 20px 50px rgba(0,0,0,0.8)}
    .modal-hd{padding:18px 20px;border-bottom:1px solid var(--bd2);display:flex;justify-content:space-between;align-items:center;flex-shrink:0}
    .modal-tit{font-family:'Playfair Display',serif;font-size:18px;color:var(--tx)}
    .modal-bd{padding:20px;overflow-y:auto;display:flex;flex-direction:column;gap:14px}
    .modal-ft{padding:16px 20px;border-top:1px solid var(--bd2);display:flex;gap:10px;justify-content:flex-end;flex-shrink:0}
    
    .f-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .m-lbl{font-size:11px;color:var(--tx2);text-transform:uppercase;letter-spacing:.05em;display:block;margin-bottom:6px}

    /* MOBILE NAVIGATION BAR */
    .bottom-nav{display:none;background:var(--s1);border-top:1px solid var(--bd2);padding:8px 10px;padding-bottom:calc(8px + var(--safe-b));justify-content:space-around;align-items:center;z-index:50}
    .bn-item{display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--tx2);font-size:10px;text-transform:uppercase;font-weight:600}
    .bn-item.on{color:var(--gold)}
    .bn-icon{font-size:20px}
    .bn-fab{background:var(--gold);color:#000;width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:24px;margin-top:-24px;box-shadow:0 4px 12px rgba(201,168,76,.4)}

    /* AJUSTES RESPONSIVE (CELULAR) */
    @media(max-width: 768px){
      .layout{grid-template-columns:1fr;grid-template-rows:1fr auto}
      .sidebar{display:none} /* Oculta sidebar en celu, se usa Bottom Nav */
      .bottom-nav{display:flex}
      .main-hd{flex-wrap:wrap; gap:10px;}
      .main-hd .vtabs{order:3; width:100%; justify-content:space-between}
      .main-hd .vtabs .vtab{flex:1; text-align:center; padding:8px}
      .cal-cell{main-height:90px}
      .chip{font-size:9.5px; padding:3px}
      .f-row{grid-template-columns:1fr}
      .modal-box{border-radius:12px}
      .data-table-wrapper{border-radius:10px}
      .modal-tit{font-size:16px}
      .m-lbl{font-size:10px}
      input, select, textarea{font-size:12px; padding:8px 10px}
      .btn-gold{font-size:11.5px; padding:12px}
      .btn-p, .btn-s, .btn-d{font-size:11px; padding:8px 14px}
    }
    
    /* TOAST */
    .toast{position:fixed;bottom:calc(20px + var(--safe-b));right:20px;background:var(--s3);border:1px solid var(--gold3);border-radius:9px;padding:12px 20px;font-size:13px;color:var(--tx);z-index:300;box-shadow:0 12px 34px rgba(0,0,0,.5);animation:slideUp .25s ease;pointer-events:none}
  </style>
</head>
<body>

<div id="splash">
  <div style="font-family:'Playfair Display',serif;font-size:22px;color:var(--gold)">Mariana Sánchez &amp; Asociados</div>
  <div class="sp-spin"></div>
</div>

<div id="root"></div>
<div id="pdf-render-area" style="display:none;"></div>

<script type="text/babel">
const { useState, useEffect } = React;
const { createClient } = window.supabase;

const TIPOS = [
  { id:"audiencia",   label:"Audiencia",   icon:"⚖️" },
  { id:"vencimiento", label:"Vencimiento", icon:"⏰" },
  { id:"reunion",     label:"Reunión",     icon:"🤝" },
  { id:"otro",        label:"Otro",        icon:"📋" }
];

const DIAS = ["Dom","Lun","Mar","Mié","Jue","Vie","Sáb"];
const MESES = ["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
const hoyStr = () => new Date().toISOString().split("T")[0];

// Funciones de seguridad para la memoria del navegador
const getLocalSafe = (key, fallback) => {
  try {
    const val = localStorage.getItem(key);
    return val ? JSON.parse(val) : fallback;
  } catch(e) { return fallback; }
};

const defAbogados = [
  { id:"p",  nombre:"Dra. Mariana Sánchez", ini:"MS", color:"#C9A84C" },
  { id:"a1", nombre:"Dr. Carlos Mendoza",   ini:"CM", color:"#5491C8" },
];

function App() {
  const [pantalla, setPantalla] = useState("login"); 
  const [sb, setSb] = useState(null);
  const [toast, setToast] = useState(null);
  
  // ESTADOS DE DATOS (CON RECUPERACIÓN SEGURA)
  const [eventos, setEventos] = useState([]);
  const [abogados, setAbogados] = useState(() => getLocalSafe("agenda_abg", defAbogados));
  const [alertas, setAlertas] = useState(() => getLocalSafe("agenda_alerts", {email:"", wsp:""}));
  
  // ESTADOS UI
  const [vista, setVista] = useState("mes");
  const [curFecha, setCurFecha] = useState(new Date());
  const [filtroAbg, setFiltroAbg] = useState(null);
  const [modalEv, setModalEv] = useState(null);
  const [modalEquipo, setModalEquipo] = useState(false);
  const [modalAlertas, setModalAlertas] = useState(false);
  const [loading, setLoading] = useState(false);

  // AUTO-GUARDADO DE CONFIGURACIONES LOCALES
  useEffect(() => { localStorage.setItem("agenda_abg", JSON.stringify(abogados)); }, [abogados]);
  useEffect(() => { localStorage.setItem("agenda_alerts", JSON.stringify(alertas)); }, [alertas]);

  // INICIO SEGURO DE SUPABASE
  useEffect(() => {
    const init = async () => {
      try {
        const url = localStorage.getItem("sb_url");
        const key = localStorage.getItem("sb_key");
        if (url && key) {
          const client = createClient(url, key);
          setSb(client);
          await fetchEventos(client);
        } else {
          setPantalla("config");
        }
      } catch (e) {
        setPantalla("config");
      } finally {
        setTimeout(() => document.getElementById("splash")?.classList.add("out"), 500);
      }
    };
    init();
  }, []);

  const showToast = (msg) => {
    setToast(msg);
    setTimeout(() => setToast(null), 3000);
  };

  const fetchEventos = async (client) => {
    setLoading(true);
    try {
      const { data, error } = await client.from("eventos").select("*");
      if (!error && data) {
        setEventos(data.map(d => ({
          id: d.id, title: d.title || "Causa sin título", type: d.type || "audiencia",
          date: d.date || hoyStr(), startTime: d.start_time || "09:00",
          endTime: d.end_time || "10:00", lawyers: d.lawyers || [],
          notes: d.notes || "", court: d.court || "", expNum: d.exp_num || ""
        })));
      }
    } catch(e) { console.error("Error DB", e); }
    finally { setLoading(false); }
  };

  const guardarEv = async (f) => {
    const payload = {
      id: f.id || `e_${Date.now()}`, title: f.title, type: f.type, date: f.date,
      start_time: f.startTime, end_time: f.endTime, lawyers: f.lawyers,
      notes: f.notes, court: f.court, exp_num: f.expNum
    };
    try {
      await sb.from("eventos").upsert(payload);
      setModalEv(null);
      showToast("Evento guardado.");
      fetchEventos(sb);
    } catch(e) { showToast("Error al guardar."); }
  };

  const eliminarEv = async (id) => {
    try { await sb.from("eventos").delete().eq("id", id); setModalEv(null); showToast("Evento eliminado."); fetchEventos(sb); } catch(e) {}
  };

  // ENVIAR WHATSAPP
  const generarWsp = (ev) => {
    if(!alertas.wsp) { alert("Por favor configurá tu número de WhatsApp en la sección de Alertas (🔔) primero."); return; }
    const num = alertas.wsp.replace(/[^0-9]/g, '');
    const texto = `*RECORDATORIO JUDICIAL* ⚖️\n\n*Causa:* ${ev.title}\n*Fecha:* ${ev.date}\n*Hora:* ${ev.startTime}\n*Expediente:* ${ev.expNum||'-'}\n*Juzgado:* ${ev.court||'-'}`;
    window.open(`https://wa.me/${num}?text=${encodeURIComponent(texto)}`, '_blank');
  };

  // VISTAS
  const renderCalendario = () => {
    const filtrados = filtroAbg ? eventos.filter(e=>e.lawyers?.includes(filtroAbg)) : eventos;
    
    if(vista === "mes") {
      const año = curFecha.getFullYear(); const mes = curFecha.getMonth();
      const pri = new Date(año,mes,1).getDay(); const dias = new Date(año,mes+1,0).getDate();
      const prev = new Date(año,mes,0).getDate();
      const cels = [];
      for(let i=pri-1;i>=0;i--) cels.push({d:prev-i,otra:true,m:mes-1});
      for(let i=1;i<=dias;i++) cels.push({d:i,otra:false,m:mes});
      while(cels.length % 7 !== 0) cels.push({d:cels.length-dias-pri+1,otra:true,m:mes+1});

      return (
        <div className="cal-grid fade-in">
          {DIAS.map(d=><div key={d} className="cal-hdr">{d}</div>)}
          {cels.map((c,idx)=>{
            const ds = `${año}-${String(c.m+1).padStart(2,"0")}-${String(c.d).padStart(2,"0")}`;
            const des = filtrados.filter(e=>e.date===ds);
            return (
              <div key={idx} className={`cal-cell ${c.otra?"otra":""} ${ds===hoyStr()?"hoy":""}`} onClick={()=>!c.otra && (setCurFecha(new Date(ds+"T12:00:00")), setVista("dia"))}>
                <div className="dn">{c.d}</div>
                <div style={{flex:1,overflow:"hidden"}}>
                  {des.slice(0,3).map(e=>(
                    <div key={e.id} className="chip" style={{background:abogados.find(a=>a.id===(e.lawyers?.[0]))?.color || "var(--gold)"}} onClick={(x)=>{x.stopPropagation(); setModalEv(e);}}>
                      {e.title}
                    </div>
                  ))}
                  {des.length>3 && <div style={{fontSize:10,color:"var(--gold)",fontWeight:"bold"}}>+{des.length-3}</div>}
                </div>
              </div>
            );
          })}
        </div>
      );
    }

    if(vista === "dia") {
      const ds = curFecha.toISOString().split("T")[0];
      const dEvs = filtrados.filter(e=>e.date===ds).sort((a,b)=>a.startTime.localeCompare(b.startTime));
      return (
        <div className="fade-in">
          <div style={{fontSize:16, fontWeight:600, marginBottom:16, paddingBottom:10, borderBottom:"1px solid var(--bd2)"}}>
            {curFecha.toLocaleDateString("es-AR",{weekday:"long",day:"numeric",month:"long"})}
          </div>
          {dEvs.length===0 ? <div style={{textAlign:"center", color:"var(--tx3)", padding:30}}>Día sin compromisos.</div> : 
            dEvs.map(ev=>(
              <div key={ev.id} className="list-card" onClick={()=>setModalEv(ev)}>
                <div className="list-bar" style={{background:abogados.find(a=>a.id===(ev.lawyers?.[0]))?.color || "var(--gold)"}}/>
                <div style={{flex:1}}>
                  <div className="list-tit">{ev.startTime} hs - {ev.title}</div>
                  <div className="list-meta">Exp: {ev.expNum||"S/D"} | {ev.court||"S/D"}</div>
                </div>
                <button className="btn-wsp" onClick={(e)=>{e.stopPropagation(); generarWsp(ev);}}>WSP</button>
              </div>
            ))
          }
        </div>
      );
    }

    if(vista === "lista") {
      return (
        <div className="fade-in">
          {filtrados.sort((a,b)=>a.date.localeCompare(b.date)).map(ev=>(
            <div key={ev.id} className="list-card" onClick={()=>setModalEv(ev)}>
              <div className="list-bar" style={{background:abogados.find(a=>a.id===(ev.lawyers?.[0]))?.color || "var(--gold)"}}/>
              <div style={{flex:1}}>
                <div className="list-tit">[{ev.date}] {ev.title}</div>
                <div className="list-meta">Expediente: {ev.expNum||"S/D"}</div>
              </div>
            </div>
          ))}
        </div>
      );
    }
  };

  // PANTALLAS DE ACCESO (CONFIGURACIÓN SUPABASE)
  if (pantalla === "config") {
    return (
      <div className="pant-bg fade-in" style={{padding:20}}>
        <div className="card" style={{width:"100%", maxWidth:420, textAlign:"center"}}>
          <h2 style={{color:"var(--gold)", marginBottom:10}}>Conectar Supabase</h2>
          <p style={{fontSize:13, color:"var(--tx2)", marginBottom:20}}>Ingresá tus credenciales para vincular la base de datos.</p>
          <input id="inUrl" placeholder="URL del Proyecto" defaultValue={localStorage.getItem("sb_url")} style={{marginBottom:12}}/>
          <input id="inKey" type="password" placeholder="Anon Key" defaultValue={localStorage.getItem("sb_key")} style={{marginBottom:24}}/>
          <button className="btn-gold" onClick={()=>{
            localStorage.setItem("sb_url", document.getElementById("inUrl").value);
            localStorage.setItem("sb_key", document.getElementById("inKey").value);
            window.location.reload();
          }}>Guardar y Entrar</button>
        </div>
      </div>
    );
  }

  // PANTALLA LOGIN PROFESIONAL (ESTILO ORIGINAL RECUPERADO)
  if (pantalla === "login") {
    return (
      <div className="pant-bg fade-in" style={{padding:20}}>
        <div className="card">
          <div className="sello">M.S.<br/>&amp;A.</div>
          <div className="firma">MARIANA SÁNCHEZ<br/>&amp; ASOCIADOS</div>
          <div className="firma-sub">Estudio Jurídico</div>
          <hr className="divider"/>
          <p className="cita">"La justicia y la diligencia procesal sostienen la solidez del bufete corporativo."</p>
          <button className="btn-gold" onClick={()=>setPantalla("app")} style={{marginBottom: 16}}>INGRESAR A LA AGENDA</button>
          <button style={{background:"none", color:"var(--tx2)", fontSize:12, width:"100%", textDecoration:"underline"}} onClick={()=>setPantalla("config")}>Reconfigurar Servidor</button>
        </div>
      </div>
    );
  }

  // INTERFAZ PRINCIPAL
  return (
    <div className="layout fade-in">
      
      {/* SIDEBAR PC */}
      <div className="sidebar">
        <div className="sb-hd">
          <div className="l-sello">M.S.</div>
          <div><div className="l-nm">Mariana Sánchez</div><div className="l-sb">Agenda Legal</div></div>
        </div>
        <div className="sb-body">
          <div className="sb-sec"><span>Miembros del Estudio</span> <button style={{background:"none", color:"var(--gold)", fontSize:16}} onClick={()=>setModalEquipo(true)}>⚙️</button></div>
          <div className={`abg-row ${filtroAbg===null?"on":""}`} onClick={()=>setFiltroAbg(null)}>
            <div className="av" style={{background:"var(--s4)",color:"var(--tx)"}}>∀</div><div className="a-nm">Todo el Bufete</div>
          </div>
          {abogados.map(a=>(
            <div key={a.id} className={`abg-row ${filtroAbg===a.id?"on":""}`} onClick={()=>setFiltroAbg(a.id)}>
              <div className="av" style={{background:a.color}}>{a.ini}</div><div className="a-nm">{a.nombre}</div>
            </div>
          ))}
        </div>
        <div style={{padding:16, borderTop:"1px solid var(--bd2)", display:"flex", flexDirection:"column", gap:10}}>
          <button className="btn-s" style={{width:"100%"}} onClick={()=>setModalAlertas(true)}>🔔 Alertas WhatsApp</button>
          <button className="btn-s" style={{width:"100%", color:"var(--red)", borderColor:"var(--red)"}} onClick={()=>{setPantalla("login"); setFiltroAbg(null)}}>Cerrar Sesión</button>
        </div>
      </div>

      {/* MAIN APP */}
      <div className="main">
        <div className="main-hd">
          <div style={{display:"flex",alignItems:"center",gap:6}}>
            <button className="nav-btn" onClick={()=>setCurFecha(new Date(curFecha.getFullYear(), curFecha.getMonth()-1, 1))}>‹</button>
            <span className="mes-tit" style={{margin:"0 4px"}}>{MESES[curFecha.getMonth()]} {curFecha.getFullYear()}</span>
            <button className="nav-btn" onClick={()=>setCurFecha(new Date(curFecha.getFullYear(), curFecha.getMonth()+1, 1))}>›</button>
          </div>
          <div className="vtabs">
            {["mes","dia","lista"].map(v=><button key={v} className={`vtab ${vista===v?"on":""}`} onClick={()=>setVista(v)}>{v.toUpperCase()}</button>)}
          </div>
          <button className="nav-btn" style={{background:"transparent", color:"var(--gold)", width:"auto", padding:"0 10px"}} onClick={()=>setCurFecha(new Date())}>HOY</button>
        </div>
        <div className="cal-scroll">
          {loading ? <div style={{textAlign:"center", padding:40}}><div className="sp-spin" style={{margin:"0 auto"}}></div></div> : renderCalendario()}
        </div>
      </div>

      {/* BOTTOM NAV (MOBILE) */}
      <div className="bottom-nav">
        <div className={`bn-item ${vista==="mes"?"on":""}`} onClick={()=>setVista("mes")}><span className="bn-icon">📅</span>Mes</div>
        <div className={`bn-item ${vista==="lista"?"on":""}`} onClick={()=>setVista("lista")}><span className="bn-icon">📋</span>Lista</div>
        <div className="bn-item" onClick={()=>{setModalEv({date:hoyStr()})}}><div className="bn-fab">+</div></div>
        <div className="bn-item" onClick={()=>setModalEquipo(true)}><span className="bn-icon">👥</span>Equipo</div>
        <div className="bn-item" onClick={()=>setModalAlertas(true)}><span className="bn-icon">🔔</span>Alertas</div>
      </div>

      {/* MODAL EVENTO */}
      {modalEv && (
        <div className="modal-ov" onClick={e=>e.target===e.currentTarget&&setModalEv(null)}>
          <div className="modal-box">
            <div className="modal-hd">
              <div className="modal-tit">{modalEv.id ? "Editar Causa" : "Nueva Causa / Audiencia"}</div>
              <button style={{background:"none", color:"var(--tx2)", fontSize:20}} onClick={()=>setModalEv(null)}>✕</button>
            </div>
            <div className="modal-bd">
              <div className="f-grp"><label className="m-lbl">Carátula *</label><input defaultValue={modalEv.title} id="ev_t" placeholder="Ej: Perez c/ Gómez"/></div>
              <div className="f-row">
                <div className="f-grp"><label className="m-lbl">N° Expediente</label><input defaultValue={modalEv.expNum} id="ev_exp"/></div>
                <div className="f-grp"><label className="m-lbl">Juzgado / Fuero</label><input defaultValue={modalEv.court} id="ev_c"/></div>
              </div>
              <div className="f-row">
                <div className="f-grp"><label className="m-lbl">Fecha</label><input type="date" defaultValue={modalEv.date} id="ev_d"/></div>
                <div className="f-grp"><label className="m-lbl">Hora de Inicio</label><input type="time" defaultValue={modalEv.startTime||"09:00"} id="ev_h"/></div>
              </div>
              <div className="f-grp">
                <label className="m-lbl">Abogado Asignado</label>
                <select id="ev_abg" defaultValue={modalEv.lawyers?.[0]||"p"}>
                  {abogados.map(a=><option key={a.id} value={a.id}>{a.nombre}</option>)}
                </select>
              </div>
              <div className="f-grp"><label className="m-lbl">Anotaciones</label><textarea defaultValue={modalEv.notes} id="ev_n"/></div>
            </div>
            <div className="modal-ft">
              {modalEv.id && <button className="btn-d" onClick={()=>eliminarEv(modalEv.id)}>Eliminar Causa</button>}
              <button className="btn-s" onClick={()=>setModalEv(null)}>Cancelar</button>
              <button className="btn-p" onClick={()=>guardarEv({
                ...modalEv, title:document.getElementById("ev_t").value, expNum:document.getElementById("ev_exp").value,
                court:document.getElementById("ev_c").value, date:document.getElementById("ev_d").value,
                startTime:document.getElementById("ev_h").value, lawyers:[document.getElementById("ev_abg").value],
                notes:document.getElementById("ev_n").value
              })}>Guardar en Agenda</button>
            </div>
          </div>
        </div>
      )}

      {/* MODAL EQUIPO (ABOGADOS) */}
      {modalEquipo && (
        <div className="modal-ov" onClick={e=>e.target===e.currentTarget&&setModalEquipo(false)}>
          <div className="modal-box">
            <div className="modal-hd"><div className="modal-tit">Gestión de Abogados</div><button style={{background:"none",color:"var(--tx2)", fontSize:20}} onClick={()=>setModalEquipo(false)}>✕</button></div>
            <div className="modal-bd">
              {abogados.map((a)=>(
                <div key={a.id} style={{display:"flex", gap:10, alignItems:"center", background:"var(--s2)", padding:10, borderRadius:8}}>
                  <div className="av" style={{background:a.color}}>{a.ini}</div>
                  <div style={{flex:1, fontSize:14}}>{a.nombre}</div>
                  <button className="btn-d" style={{padding:"6px 12px", marginRight:0}} onClick={()=>{
                    if(confirm("¿Eliminar a "+a.nombre+" del estudio?")) setAbogados(abogados.filter(x=>x.id!==a.id));
                  }}>Borrar</button>
                </div>
              ))}
              <div style={{borderTop:"1px solid var(--bd2)", paddingTop:16, marginTop:8}}>
                <div style={{fontSize:13, color:"var(--gold)", marginBottom:12, fontWeight:"bold"}}>+ Agregar Nuevo Miembro</div>
                <div className="f-grp"><input id="n_nom" placeholder="Nombre completo (ej: Dr. Juan Pérez)"/></div>
                <div className="f-row">
                  <div className="f-grp"><input id="n_ini" placeholder="Iniciales (ej: JP)" maxLength={3}/></div>
                  <div className="f-grp">
                    <select id="n_col">
                      <option value="#C9A84C">Dorado (Socio)</option>
                      <option value="#5491C8">Azul (Asociado)</option>
                      <option value="#4DAAA0">Verde (Junior)</option>
                      <option value="#8E6DC4">Violeta</option>
                      <option value="#C46D6D">Rojo</option>
                    </select>
                  </div>
                </div>
                <button className="btn-s" style={{width:"100%", marginTop:8}} onClick={()=>{
                  const nom = document.getElementById("n_nom").value; const ini = document.getElementById("n_ini").value;
                  if(!nom || !ini) return alert("Por favor completá nombre e iniciales.");
                  setAbogados([...abogados, {id:"a_"+Date.now(), nombre:nom, ini:ini.toUpperCase(), color:document.getElementById("n_col").value}]);
                  document.getElementById("n_nom").value = ""; document.getElementById("n_ini").value = "";
                }}>Añadir al Equipo</button>
              </div>
            </div>
          </div>
        </div>
      )}

      {/* MODAL ALERTAS WSP */}
      {modalAlertas && (
        <div className="modal-ov" onClick={e=>e.target===e.currentTarget&&setModalAlertas(false)}>
          <div className="modal-box">
            <div className="modal-hd"><div className="modal-tit">Configuración de Alertas</div><button style={{background:"none",color:"var(--tx2)", fontSize:20}} onClick={()=>setModalAlertas(false)}>✕</button></div>
            <div className="modal-bd">
              <p style={{fontSize:13, color:"var(--tx2)", lineHeight:1.5}}>Configurá el número al que querés enviar los mensajes de recordatorio por WhatsApp. Usá el formato completo (Ej: 549...).</p>
              <div className="f-grp">
                <label className="m-lbl">Número WhatsApp *</label>
                <input value={alertas.wsp} onChange={e=>setAlertas({...alertas, wsp:e.target.value})} placeholder="549..."/>
              </div>
              <div className="f-grp">
                <label className="m-lbl">E-mail corporativo</label>
                <input value={alertas.email} onChange={e=>setAlertas({...alertas, email:e.target.value})} placeholder="estudio@..."/>
              </div>
              <button className="btn-wsp" style={{justifyContent:"center", padding:"12px", fontSize:13, width:"100%", marginTop:8}} onClick={()=>{
                if(!alertas.wsp) return alert("Ingresá un número primero para probar.");
                window.open(`https://wa.me/${alertas.wsp.replace(/[^0-9]/g,'')}?text=Prueba%20de%20conexion%20Agenda%20Legal`, '_blank');
              }}>Probar Conexión WhatsApp</button>
            </div>
            <div className="modal-ft"><button className="btn-p" onClick={()=>setModalAlertas(false)}>Guardar y Cerrar</button></div>
          </div>
        </div>
      )}

      {/* TOAST SYSTEM */}
      {toast && <div className="toast">{toast}</div>}

    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root")); 
root.render(<App />);
</script>
</body>
</html>
